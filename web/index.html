<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gridwell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/vendor/xterm/xterm.min.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: var(--gw-bg, #0c0d11); color: var(--gw-text-fg, #d8d9de); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }

    /* Every color below is a --gw- custom property the wasm client writes onto
       the root element from client/theme; the literals here are only the ground
       the boot overlay stands on before the client runs. */

    /* Modal: centered card over a dim backdrop. */
    .gw-modal {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: var(--gw-scrim);
      z-index: 20;
    }
    .gw-modal.open { display: flex; }
    .gw-modal .card {
      background: var(--gw-menu-bg);
      border: 1px solid var(--gw-border);
      border-radius: 6px;
      padding: 20px 24px;
      /* A fixed width: suggestion matches would otherwise stretch the card
         per keystroke and make it jump. Long entries ellipsize inside the
         stable box instead. */
      width: 480px;
      max-width: 80vw;
      box-sizing: border-box;
      box-shadow: 0 8px 32px var(--gw-card-shadow);
    }
    .gw-modal h2 { margin: 0 0 16px 0; font-size: 14px; font-weight: 500; color: var(--gw-text-fg); letter-spacing: 0.04em; text-transform: lowercase; }
    .gw-modal label { display: block; font-size: 11px; color: var(--gw-dim); margin-top: 4px; text-transform: lowercase; letter-spacing: 0.05em; }
    .gw-modal input[type=text] {
      width: 100%; padding: 8px 10px; margin-top: 6px;
      border-radius: 4px; border: 1px solid var(--gw-border);
      background: var(--gw-bg); color: var(--gw-text-fg);
      font-family: inherit; font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    .gw-modal input[type=text]:focus { border-color: var(--gw-focus-border); }
    .gw-modal .err {
      color: var(--gw-close-warn);
      font-size: 11px;
      min-height: 14px;
      margin-top: 8px;
    }
    .gw-modal .actions {
      display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 16px;
    }
    .gw-modal button {
      padding: 7px 14px;
      border-radius: 4px;
      border: 1px solid var(--gw-border);
      background: var(--gw-surface);
      color: var(--gw-text-fg);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-transform: lowercase;
    }
    .gw-modal button:hover { background: var(--gw-surface-hi); }
    .gw-modal button.primary { background: var(--gw-focus-border); border-color: var(--gw-focus-border); color: white; }
    .gw-modal button.primary:hover { background: var(--gw-primary-hi); }
    .gw-modal .gw-suggest {
      list-style: none; margin: 6px 0 0 0; padding: 0;
      max-height: 200px; overflow-y: auto;
      border-radius: 4px;
    }
    .gw-modal .gw-suggest:empty { display: none; }
    .gw-modal .gw-suggest li {
      padding: 6px 10px; font-size: 12px; color: var(--gw-subtle-text);
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid transparent; border-radius: 4px;
    }
    .gw-modal .gw-suggest li:hover,
    .gw-modal .gw-suggest li.active { background: var(--gw-surface); color: var(--gw-menu-item-hi); border-color: var(--gw-border); }

    /* Boot overlay: the wasm is a large download, and a phone on a slow link
       waits seconds or minutes for it, so say so instead of showing a black
       page. The boot script removes this the moment the wasm starts running.
       It is the one surface that paints before the client sets a palette, so
       its colors are literal and it is always dark. */
    #gw-boot {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #0c0d11;
    }
    #gw-boot .ring {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #292c36; border-top-color: #4a6fff;
      animation: gw-spin 0.9s linear infinite;
    }
    #gw-boot-msg { font-size: 12px; color: #8a8d97; letter-spacing: 0.05em; }
    #gw-boot.failed .ring { animation: none; border-color: #e0727a; }
    #gw-boot.failed #gw-boot-msg { color: #e0727a; }
    @keyframes gw-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>

  <div id="gw-boot">
    <div class="ring"></div>
    <div id="gw-boot-msg">loading gridwell…</div>
  </div>

  <div id="gw-url-modal" class="gw-modal">
    <form id="gw-url-form" class="card" autocomplete="off">
      <h2>new url tile</h2>
      <label for="gw-url-input">url</label>
      <input id="gw-url-input" type="text" placeholder="example.com" spellcheck="false">
      <ul id="gw-url-suggest" class="gw-suggest"></ul>
      <div class="err" id="gw-url-error"></div>
      <div class="actions">
        <button type="button" id="gw-url-cancel">cancel</button>
        <button type="submit" id="gw-url-submit" class="primary">create</button>
      </div>
    </form>
  </div>

  <script src="/vendor/xterm/xterm.min.js"></script>
  <script src="/vendor/xterm/addon-fit.min.js"></script>
  <script src="/vendor/xterm/addon-webgl.min.js"></script>
  <script src="/vendor/xterm/addon-unicode11.min.js"></script>
  <script src="/wasm_exec.js"></script>
  <script>
    // Boot with a visible pulse: the wasm is tens of MB, and on a slow link a
    // silent instantiateStreaming looks like a dead black page. The counter
    // reads the decoded stream and shows a real percentage, using the raw size
    // the server hands over in X-Uncompressed-Size, since with Content-Encoding
    // the browser knows only the compressed length. Failures paint into the same
    // overlay: a boot that dies must say so rather than sit black.
    //
    // The counter also checks its own arithmetic at the end of the stream. A
    // short download is otherwise silent: the gzip response carries no
    // Content-Length (ServeContent omits it under Content-Encoding), so a cut
    // connection ends the body cleanly and the browser reports only whatever
    // WebAssembly makes of the fragment — "exceeds the module's remaining
    // size". Comparing the bytes received against the size the server declared
    // names the real fault, and it is the one fault worth one retry.
    (async () => {
      const boot = document.getElementById("gw-boot");
      const msg = document.getElementById("gw-boot-msg");

      // load fetches, counts, and instantiates once. bust adds a cache-busting
      // query and bypasses the HTTP cache, so a retry cannot be answered from
      // the same truncated cache entry that failed.
      async function load(bust) {
        const resp = await fetch("/gridwell.wasm" + (bust ? "?retry=" + Date.now() : ""),
          bust ? { cache: "reload" } : undefined);
        if (!resp.ok) throw new Error("wasm fetch failed: HTTP " + resp.status);
        let received = 0;
        // The decoded total. A gzip response carries it in X-Uncompressed-Size,
        // since its Content-Length is the compressed size, while an identity
        // response's Content-Length is already the decoded size. With a total
        // the counter shows a percentage; without one, it counts megabytes and
        // there is nothing to check the end of the stream against.
        const total = Number(
          resp.headers.get("X-Uncompressed-Size") ||
          (resp.headers.get("Content-Encoding") ? 0 : resp.headers.get("Content-Length")) ||
          0
        );
        let short = null;
        const counted = new Response(new ReadableStream({
          async start(controller) {
            const reader = resp.body.getReader();
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              received += value.length;
              msg.textContent = total > 0
                ? "loading gridwell… " + Math.min(100, Math.round((received / total) * 100)) + "%"
                : "loading gridwell… " + (received / 1048576).toFixed(1) + " MB";
              controller.enqueue(value);
            }
            if (total > 0 && received !== total) {
              short = new Error("truncated download (got " + received + " of " + total + " bytes)");
              short.truncated = true;
              controller.error(short);
              return;
            }
            msg.textContent = "starting…";
            controller.close();
          },
        }), { headers: { "Content-Type": resp.headers.get("Content-Type") || "application/wasm" } });
        const go = new Go();
        try {
          // short wins over whatever WebAssembly says about the fragment: the
          // download is the fault, and the parse error is the symptom.
          return { go, result: await WebAssembly.instantiateStreaming(counted, go.importObject) };
        } catch (e) {
          throw short || e;
        }
      }

      try {
        let loaded;
        try {
          loaded = await load(false);
        } catch (e) {
          if (!e || !e.truncated) throw e;
          msg.textContent = "gridwell failed to load: " + e.message + " — retrying…";
          loaded = await load(true);
        }
        boot.remove();
        loaded.go.run(loaded.result.instance);
      } catch (e) {
        boot.classList.add("failed");
        msg.textContent = "gridwell failed to load: " + (e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
