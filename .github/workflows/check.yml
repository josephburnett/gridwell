# The per-commit gate, `make check`: fmt, proto drift, the Go module, the
# boundary lint, wasm and TS.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # proto-check regenerates and diffs, so the generator versions are
      # pinned to what produced the committed output.
      - name: install proto toolchain (pinned)
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - name: node modules
        run: cd apps/desktop && npm ci
      - name: make check
        run: make check
