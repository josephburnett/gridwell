# The heavy gates, on PRs and main: the browser suite, the connection spawn,
# direct, and partition gates, whose sshd is self-contained through dialtest,
# and the full Electron e2e under xvfb. One retry per suite
# (PW_FLAGS=--retries=1) is the CI face of the repo's flake discipline. Every
# gate here is a Makefile target: the Makefile is the one recipe and this file
# only sequences them, which test/boundary pins.
name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-and-connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The plugins are their own repository now: gridwell owns the door,
      # gridwell-plugins owns the plugins. The Makefile's PLUGINS_DIR defaults
      # to ../gridwell-plugins — beside this checkout — and `make build` /
      # `make check` build the three plugin binaries from there.
      - name: clone gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: connections gate
        run: make check-connections
      # The web config drives a chromium by explicit path (the repo's
      # offline-buildable posture); on the runner, hand it playwright's.
      - name: resolve chromium path
        run: echo "GRIDWELL_WEB_CHROMIUM=$(cd apps/desktop && node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: web gate
        run: make check-web PW_FLAGS=--retries=1
  electron-e2e:
    runs-on: ubuntu-latest
    env:
      # Electron's SUID sandbox helper can't be configured on a runner
      # (needs root-owned mode-4755); same switch the dev box uses under
      # its user-namespace xvfb.
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      # The plugins are their own repository now: gridwell owns the door,
      # gridwell-plugins owns the plugins. The Makefile's PLUGINS_DIR defaults
      # to ../gridwell-plugins — beside this checkout — and `make build` /
      # `make check` build the three plugin binaries from there.
      - name: clone gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      # Every live shell rides a tmux session (internal/local/tmux); pin it
      # present rather than trust the image (it shipped preinstalled when
      # this was added — the shell-spec failures were NOT a missing tmux).
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The runner image leaves a /tmp/tmux-<uid> tmux refuses ("directory
      # /tmp/tmux-1001 has unsafe permissions" — it must be user-owned mode
      # 700). Remove it so tmux mints it correctly on first use; the ls is
      # the evidence trail for who created it if it ever comes back badly.
      - name: tmux socket dir hygiene
        run: |
          ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* yet"
          sudo rm -rf "/tmp/tmux-$(id -u)"
          # Pre-create it CORRECTLY (0700, our uid): the unsafe dir is
          # minted during the run itself, so removal alone loses the race;
          # tmux accepts an existing user-owned 0700 dir.
          mkdir -m 700 "/tmp/tmux-$(id -u)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: electron harnesses
        run: make check-electron
      - name: pre-e2e socket dir evidence
        run: ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* before e2e"
      - name: e2e
        run: make check-e2e PW_FLAGS=--retries=1
        env:
          GRIDWELL_E2E_VERBOSE: "1"
      # Failure evidence: traces + error-context for every failed spec —
      # the shell-spec failures are runner-only, so the trace is the only
      # way to see what the app actually did.
      - name: post-e2e socket dir evidence
        if: always()
        run: |
          ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* after e2e"
          stat "/tmp/tmux-$(id -u)" 2>/dev/null || true
          getfacl "/tmp/tmux-$(id -u)" 2>/dev/null || true
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
