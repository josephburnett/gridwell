# The heavy gates (issue #260), on PRs and main: the browser suite, the
# composition-parity suite (gridwell-all — every plugin in-process), the
# federation spawn/direct/partition gates (self-contained sshd via
# dialtest), and the full Electron e2e under xvfb. One retry per suite
# is the CI face of the repo's vindicated-isolated flake discipline.
name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-and-federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: federation gate
        run: make check-federation
      # The web config drives a chromium by explicit path (the repo's
      # offline-buildable posture); on the runner, hand it playwright's.
      - name: resolve chromium path
        run: echo "GRIDWELL_WEB_CHROMIUM=$(cd apps/desktop && node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: web gate
        run: cd apps/desktop && npx playwright test --config playwright.web.config.ts --retries=1
      - name: parity gate (gridwell-all, in-process plugins)
        run: cd apps/desktop && GRIDWELL_SERVE_BIN=gridwell-all npx playwright test --config playwright.web.config.ts --retries=1
  electron-e2e:
    runs-on: ubuntu-latest
    env:
      # Electron's SUID sandbox helper can't be configured on a runner
      # (needs root-owned mode-4755); same switch the dev box uses under
      # its user-namespace xvfb.
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      # Every live shell rides a tmux session (plugins/local/tmux); pin it
      # present rather than trust the image (it shipped preinstalled when
      # this was added — the shell-spec failures were NOT a missing tmux).
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The runner image leaves a /tmp/tmux-<uid> tmux refuses ("directory
      # /tmp/tmux-1001 has unsafe permissions" — it must be user-owned mode
      # 700). Remove it so tmux mints it correctly on first use; the ls is
      # the evidence trail for who created it if it ever comes back badly.
      - name: tmux socket dir hygiene
        run: |
          ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* yet"
          sudo rm -rf "/tmp/tmux-$(id -u)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: electron harnesses
        run: cd apps/desktop && xvfb-run -a npm run test:integration && xvfb-run -a npm run test:bridge
      - name: pre-e2e socket dir evidence
        run: ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* before e2e"
      - name: e2e
        run: cd apps/desktop && npm run build && xvfb-run -a npx playwright test --retries=1
        env:
          GRIDWELL_E2E_VERBOSE: "1"
      # Failure evidence: traces + error-context for every failed spec —
      # the shell-spec failures are runner-only, so the trace is the only
      # way to see what the app actually did.
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
