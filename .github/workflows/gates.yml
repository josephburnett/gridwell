# The heavy gates, on PRs and main: the browser suite, the connection spawn,
# direct and partition gates, whose sshd is self-contained through dialtest,
# and the full Electron e2e under xvfb. PW_FLAGS=--retries=1 gives each suite
# one retry, and the target that runs it fails the job on a retry that passed
# an unledgered spec (scripts/flaky-report.mjs), so the retry is never silent.
# Every gate here is a Makefile target and this file only sequences them,
# which test/boundary pins. The one step that is not a gate is the
# shim-commit report, which prints and never fails.
name: gates
# There is no `paths:` filter. A dependency or toolchain bump, or any
# cross-cutting change, is every seam at once, and a filter keyed on go.mod or
# package-lock.json would let a plain router or door change through on the
# per-commit gate alone.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-and-connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The plugins are their own repository. The Makefile's PLUGINS_DIR
      # defaults to ../gridwell-plugins, beside this checkout, and `make
      # build` and `make check` build the plugin binaries from there.
      - name: clone gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: connections gate
        run: make check-connections
      # The web config drives a chromium by explicit path, so the repo
      # stays offline-buildable. On the runner that path is playwright's.
      - name: resolve chromium path
        run: echo "GRIDWELL_WEB_CHROMIUM=$(cd apps/desktop && node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: web gate
        run: make check-web PW_FLAGS=--retries=1
  electron-e2e:
    runs-on: ubuntu-latest
    env:
      # Electron's SUID sandbox helper needs a root-owned mode-4755 binary,
      # which a runner cannot provide. The dev box uses the same switch
      # under its user-namespace xvfb.
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The shim report below reads commit messages, and the default
          # depth-1 checkout has none to read.
          fetch-depth: 0
      # A shim commit's message is the only record that a gate ran, since
      # `make check` executes none of client/wasm. This warns rather than
      # fails: a name in a message is a claim, and this job is the proof.
      - name: shim commits that name no gate
        run: ./scripts/gates-named.sh "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
      # The plugins are their own repository. The Makefile's PLUGINS_DIR
      # defaults to ../gridwell-plugins, beside this checkout, and `make
      # build` and `make check` build the plugin binaries from there.
      - name: clone gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      # Every live shell rides a tmux session (internal/local/tmux), so it
      # is pinned present rather than trusted to the runner image.
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The runner image leaves a /tmp/tmux-<uid> that tmux refuses, since
      # it must be user-owned mode 700. Removing it lets tmux mint it
      # correctly on first use, and the ls records who created it.
      - name: tmux socket dir hygiene
        run: |
          ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* yet"
          sudo rm -rf "/tmp/tmux-$(id -u)"
          # The unsafe directory is minted during the run itself, so
          # removal alone loses the race. tmux accepts an existing
          # user-owned 0700 directory.
          mkdir -m 700 "/tmp/tmux-$(id -u)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules + playwright
        run: |
          cd apps/desktop && npm ci
          npx playwright install --with-deps chromium
      - name: build
        run: make build
      - name: electron harnesses
        run: make check-electron
      - name: pre-e2e socket dir evidence
        run: ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* before e2e"
      - name: e2e
        run: make check-e2e PW_FLAGS=--retries=1
        env:
          GRIDWELL_E2E_VERBOSE: "1"
      # Traces and error-context for every failed spec. A runner-only
      # failure leaves the trace as the only way to see what the app did.
      - name: post-e2e socket dir evidence
        if: always()
        run: |
          ls -ldn /tmp/tmux-* 2>/dev/null || echo "no /tmp/tmux-* after e2e"
          stat "/tmp/tmux-$(id -u)" 2>/dev/null || true
          getfacl "/tmp/tmux-$(id -u)" 2>/dev/null || true
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
