# The release build: a `v*` tag produces one installable artifact per OS.
#
# The tag owns the version. Nothing in the tree carries one between releases,
# so every job derives VERSION=${GITHUB_REF_NAME#v} and hands it to make,
# which stamps it into the desktop package.json, where electron-builder reads
# the artifact name, and into the gridwell binary through -ldflags -X.
#
# Nothing here creates a GitHub release. Until 1.0 the artifacts are workflow
# artifacts, fetched from the run. docs/release.md is the procedure.
#
# Three jobs run on three native runners and nothing cross-builds a
# distribution, because a dmg cannot be produced off macOS and the portable
# exe wants a Windows host. Each invokes a Makefile target, which is what a
# person runs locally too.
name: release
on:
  push:
    tags: ['v*']
  # A dry run of the whole pipeline without burning a tag. VERSION falls
  # back to 0.0.0-dev and the artifacts are named as such.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The plugins are their own repository. The Makefile's PLUGINS_DIR
      # defaults to ../gridwell-plugins, beside this checkout.
      - name: fetch gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules
        run: cd apps/desktop && npm ci
      - name: version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: AppImage
        run: make dist VERSION="${VERSION:-0.0.0-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: gridwell-linux
          path: apps/desktop/out/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: node modules
        run: cd apps/desktop && npm ci
      - name: version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/v')
      # Two dmgs, one per arch, over the one universal set of Go binaries
      # mac-bins lipos together. package.json's mac.identity is "-", ad-hoc
      # signing, because an unsigned bundle refuses to launch on Apple
      # Silicon. It is not notarized, so a first launch needs "Open
      # Anyway".
      - name: dmgs
        run: make dist-mac VERSION="${VERSION:-0.0.0-dev}"
        env:
          # No certificate is available or wanted here. Auto-discovery
          # would find nothing and warn, or find something and sign with
          # it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: gridwell-macos
          path: apps/desktop/out/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # The Makefile is the one recipe and it is a POSIX shell script.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: fetch gridwell-plugins beside this checkout
        run: git clone --depth 1 https://github.com/josephburnett/gridwell-plugins.git ../gridwell-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: gnu make
        run: choco install make --no-progress -y
      - name: node modules
        run: cd apps/desktop && npm ci
      - name: version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        if: startsWith(github.ref, 'refs/tags/v')
      # The Windows artifact's accepted degradations are in
      # docs/release.md: no live shells, no serve lock, no proc plugin, no
      # connection API.
      - name: portable exe
        run: make dist-win VERSION="${VERSION:-0.0.0-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: gridwell-windows
          path: apps/desktop/out/*.exe
          if-no-files-found: error
