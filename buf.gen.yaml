version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: api/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: api/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: api/gen
    opt:
      - paths=source_relative
  # api/rpc's Go records and their conversions are derived from the proto:
  # one description of a Tile, not three. The plugin lives in-repo, and
  # `go run` keeps it building from source so it can never be stale
  # relative to the proto it reads.
  - local: ["go", "run", "./api/rpc/internal/gen"]
    out: .
