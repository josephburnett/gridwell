// data.proto is the single source of truth for Gridwell's wire types and
// the persisted record shapes. Every field in Grid / Tile maps 1:1 to a
// column in the hand-written DDL (internal/store/schema.go); a drift-lint
// test fails the build if they get out of sync.
//
// Conventions:
//   - kind / source_kind / text_mode are string fields, not enums. The
//     DDL CHECK constraints already pin the closed sets; carrying them
//     as strings keeps the proto-to-column mapping mechanical and lets
//     us add named constants alongside the generated types.
//   - created_at / updated_at exist in the DDL but are not exposed on
//     the wire (and not in the proto). They are pure storage metadata.
syntax = "proto3";

package gridwell.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/gridwell/v1;gridwellv1";

// (The Path message is gone — 2026-07-26 contraction: every mutation is
// id-addressed + version-claimed; the server derives location facts itself.)

// Grid is the persistent unit of canvas. Tiles live in grids; wells
// point at child grids. The root grid has no parent.
//
// source_kind is empty for a regular Gridwell-owned grid, "fs" for a
// grid whose tile list is reconciled against a host directory, "proc"
// for the process table. source_id carries the path or PID.
message Grid {
  string id = 1;
  string object_id = 2;
  int64 version = 3;
  string source_kind = 4;
  string source_id = 5;
  // writable reports whether the grid's OWNING plugin accepts mutations —
  // per grid, not per local plugin entry, because through a node mount one
  // local plugin (ssh) fronts many remote plugins with differing
  // capabilities. Stamped by the serving node from the owning plugin's Info
  // (leaf) or passed through verbatim (transit); wire-only, never persisted.
  bool writable = 6;
  // scratch_grid_id is the OWNING plugin's ephemeral-url scratch grid,
  // qualified from the receiver's perspective (chained through mounts) —
  // same stamping rule as writable. "" when the plugin has none. Wire-only.
  string scratch_grid_id = 7;
  // 8 (proxy_endpoint): removed 2026-07-26 with the network-context surface
  // (live url tiles always browse from the host's own network).
  reserved 8;
  // create_schemas maps a tile kind to the JSON Schema (a small subset —
  // string/number/enum/required, plus a "secret" format hint that masks
  // INPUT only) describing the parameters a creation of that kind needs in
  // THIS grid's plugin (issue #198). Stamped by the serving node from the
  // owning plugin's Info exactly like writable; a transit hop passes it
  // VERBATIM, so through any chain the schema is always the plugin that
  // owns the grid you're dropping into. Empty/absent kind = no parameters
  // (today's flow). The params themselves are the created tile's CONTENT —
  // a JSON document committed through WriteContent; the plugin validates
  // authoritatively at commit (the client's form is UX, never authority).
  // Wire-only, never persisted.
  map<string, string> create_schemas = 9;
  // stale marks a response served from a mount's offline cache (issue
  // #256): the mount is unreachable and this is the REMEMBERED answer,
  // not the live one. Stamped only by the node-side mountcache on its
  // serve-stale path; wire-only, never persisted — the same
  // derived-fact shape as writable/serves_page.
  bool stale = 12;
  // node_ns is the namespace chain of the NODE serving this grid, from
  // the receiver's perspective: "" for a grid served by the node you are
  // talking to; "<transit>/<conn>" (or deeper) through mounts — each
  // transit hop prepends its segment, exactly like scratch_grid_id. The
  // one owner of "which node is this pane inside" (remote-menu,
  // 2026-08-16): the client keys its per-pane + menu context by it and
  // routes ListPlugins with it. Wire-only, never persisted.
  string node_ns = 10;
  // menu_entries is the owning plugin's declared (+) menu additions for
  // this grid (see MenuEntry) — stamped from Info by the serving node,
  // verbatim through transit (grid_id prefixed per hop). Wire-only.
  repeated MenuEntry menu_entries = 11;
}

// MenuEntry is one plugin-declared (+) menu entry (issue #258) — the
// generic mechanism behind plugin-specific creation tools (fs "search")
// and extra plugin roots (local's trashcan, #262). Declared in Info,
// stamped per grid by the serving node exactly like create_schemas, and
// passed VERBATIM through transit hops (grid_id gains the hop prefix
// like every id). Two shapes, by which field is set:
//
//   - grid_id set: a ROOT entry — the swatch behaves exactly like a
//     plugin swatch over that grid (click descends, drag drops an
//     exit-well link). kind/param_schema are ignored.
//   - kind set: a CREATION entry — dropping it creates a tile of that
//     kind carrying menu_entry = id (the plugin recognizes its own
//     entries); param_schema, when non-empty, is the #198-subset JSON
//     Schema the client prompts with ON FIRST DESCENT (#209's
//     drop-first rule) and commits as the tile's CONTENT through
//     WriteContent — the plugin validates authoritatively.
message MenuEntry {
  string id           = 1; // entry identity within the plugin; rides created tiles as Tile.menu_entry
  string label        = 2; // swatch label, verbatim
  string glyph        = 3; // the declared glyph vocabulary ("" = the kind's default face)
  string color        = 4; // optional CSS accent for the swatch border/glyph ("" = default)
  string kind         = 5; // creation entries: text | url | shell | well | pane
  string param_schema = 6; // creation entries: the parameter form ("" = no params)
  string grid_id      = 7; // root entries: the target grid, qualified per hop
}

// Tile is the persistent unit of content in a grid. kind selects which
// subset of the optional fields is meaningful; the DDL CHECK constraint
// enforces it.
message Tile {
  string id = 1;
  string object_id = 2;
  int64 version = 3;
  string grid_id = 4;
  string kind = 5;
  int64 x = 6;
  int64 y = 7;
  int64 w = 8;
  int64 h = 9;

  // well-only: the child grid's framing — at once the preview frame,
  // the descent target, and the ascent return value.
  int64 view_x = 10;
  int64 view_y = 11;
  double view_zoom = 12;
  string child_grid_id = 13;

  // text-only: text_x/text_y is the scroll offset; text_w/text_h is the
  // window size; all four are doc-space px. text_mode is "rendered" or
  // "text". blob_id points at the markdown source in the blobs table.
  int64 text_x = 14;
  int64 text_y = 15;
  int64 text_w = 16;
  int64 text_h = 17;
  string text_mode = 18;
  int64 blob_id = 19;

  // url-only: the http(s) URL plus a pointer at the last-frozen JPEG
  // preview (in the blobs table; hash-deduped across clones).
  string url_string = 20;
  int64 preview_blob_id = 21;

  // 22 (fs_path), 23 (pid), 24 (source_key): removed with the legacy
  // source-grid reconciler. A file/process well is now a plain well whose
  // child_grid_id is a qualified "<plugin-uuid>/<grid-id>" reference.

  // alt_text is the canonical display label, rendered verbatim by the
  // client. Stamped at insert time (for plugin-owned tiles, the entry name;
  // for an exit well, the mounted plugin's label).
  string alt_text = 25;

  // reference reports that this well is a LINK, not owned content: its
  // child_grid_id is a qualified cross-plugin reference (a mounted plugin,
  // a file/process well, a cross-plugin clone) rather than a bare local
  // child grid. It is the single authoritative "is a link" signal — the
  // client renders a dashed border from it, and delete/clone already treat
  // a qualified child_grid_id as unlink-only / share (never cascade). Set
  // by the server in qualifyTiles (a child that arrived already qualified),
  // so render and the store can never disagree on what a link is. Wire-only,
  // derived — never a stored column.
  bool reference = 26;

  // content_zoom scales the CONTENT rendered inside a text/shell/url tile —
  // the text font, the terminal font, the page zoom (issue #82). Framing,
  // not content: persisted per tile, never bumps version. 0 means unset
  // (renders at 1.0). Written by the SetTile content_zoom arm only.
  double content_zoom = 27;

  // url_history is a url tile's persisted navigation back-stack (JSON
  // {index, entries:[{url,title}]}, capped) captured at freeze so a revived
  // tile can still go "back" (issue #113). Rides the url SetTile writeback;
  // an empty value on a write leaves the stored history untouched (a partial
  // capture must not clobber it, mirroring the preview-JPEG rule).
  string url_history = 28;

  // link_target_id makes a LEAF tile (text/url/shell/pane) a LINK: a
  // qualified "<plugin-uuid>/<tile-id>" reference to the tile that owns the
  // content. The link row stores no content of its own (no blob, no url, no
  // preview) — readers resolve bytes/preview/session through the target id,
  // which the router already routes anywhere (including through transit
  // chains, which prepend one hop segment exactly as they do for a well's
  // qualified child_grid_id). Kind stays the target's kind; link-ness is
  // orthogonal metadata. The well kind's link variant remains a qualified
  // child_grid_id (the battle-tested exit well) — Reference is the single
  // derived "is a link" bit over both shapes. Deleting a link only unlinks.
  string link_target_id = 29;

  // url_frozen is the USER'S standing freeze on a url tile (issue #237):
  // set by the explicit freeze gesture, cleared by the reconnect button.
  // While set, descending does NOT auto-go-live (unlike the transient
  // navigate-away freeze, which auto-revives on return). Framing-class —
  // written by the SetTile url_frozen arm only, never bumps version.
  bool url_frozen = 30;

  // configure_plugin_id (issue #251) marks a CHILDLESS well as an
  // UNCONFIGURED PLUGIN WELL: the uuid of the parameterized plugin whose
  // instance will fill it (dropping the ssh plugin onto a grid lands one).
  // First descent opens that plugin's instance picker; adopting an
  // instance sets child_grid_id (the SetTile adopt_child_grid arm) and the
  // uuid stays as provenance. "" for every other tile.
  string configure_plugin_id = 31;

  // serves_page (2026-08-11): the owning plugin serves this tile's content
  // as WEB CONTENT through the /content/ door (rpc ServeContent) — an image
  // file, an HTML page. The client gives the descent url-tile semantics (a
  // live native view on a desktop host, open-in-new-tab on a browser host)
  // at the DERIVED address /content/<content-token>/<tile-id>/ — derived at
  // render time from the current origin, never persisted (ports are
  // ephemeral). Plugin-declared, derived from the content itself (fs: the
  // filename's media type) — never a stored column.
  bool serves_page = 32;

  // text_presentation (2026-08-13): the owning plugin's declaration of how
  // a text tile's body PRESENTS — "plain" (monospace, no markdown
  // interpretation: source code, logs), "rendered" (document renderer
  // only), or "both" (rendered by default, user may toggle to the raw
  // source). "" = no declaration: the stored user text_mode rules, as it
  // always has for localdb docs. Plugin-derived from the content itself
  // (fs: the filename/sniff) — wire-only, never a stored column.
  string text_presentation = 33;

  // menu_entry names the plugin MenuEntry a creation-entry drop minted
  // this tile from (issue #258) — how a plugin recognizes its own tools
  // (fs's "search" well vs a plain well). Set at CreateTile; plugins
  // that declare entries persist it; others may ignore it. The client
  // prompts for the entry's params on first descent when the tile has
  // no content yet.
  string menu_entry = 34;
}

// ─── Plugin / node lifecycle ──────────────────────────────────────────────
// The same RPCs are exposed by a local server, a plugin process, and a
// remote server reached over SSH. The client talks to the local server;
// the server routes to plugins; an SSH gateway transparently proxies.

// Info is the whole plugin handshake: a plugin loaded from server.yaml is
// simply "there", so Info reports its identity AND its default root grid (the
// grid the launcher descends into). There is no Attach/Detach — the gRPC
// connection, opened at load and closed at unload, is the only lifecycle.
message InfoRequest {}
message InfoResponse {
  string kind           = 1;   // e.g. "local", "fs", "proc", "remote"
  string display_name   = 2;
  int64  schema_version = 3;
  bool   watch          = 4;   // implements Subscribe for live change events
  // root_grid_id is the plugin's default root (fs uses its configured root,
  // proc pid 1, localdb its singleton root). Click-enter descends here.
  string root_grid_id   = 5;
  reserved 6; // network (NetworkContext): removed 2026-07-26 — host network always
  reserved 7; // has_session: removed 2026-07-26 — the session is host-local
  // create_schemas: per-kind creation-parameter schemas (see
  // Grid.create_schemas — this is the declaration the grid stamp reads).
  map<string, string> create_schemas = 13;
  // scratch_grid_id is the plugin's off-grid grid for EPHEMERAL url tiles
  // ("descend into a url" without placing a tile). Never rendered, never
  // mounted; persists as visited-url history. Empty for plugins that don't
  // support ephemeral visits (fs/proc).
  string scratch_grid_id = 8;
  // writable reports that this plugin accepts CreateTile (new primitives can
  // be dropped into its grids). Like watch, a capability the
  // plugin declares once here — the server must never re-derive it from the
  // kind string, or a remote plugin reached through a proxy (whose local kind
  // is "ssh") is wrongly presented read-only.
  bool writable = 9;
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport (the
  // center in world cell coords and the live zoom). Filled by localdb from
  // its system KV table; fs/proc return zero (no persistent root view). The
  // client seeds the portal-well framing on enterPlugin so re-entry restores
  // exactly the left-off view. Purely a read: the write path is SetRootView.
  double root_view_cx   = 10;
  double root_view_cy   = 11;
  double root_view_zoom = 12;
  // instance_grid_id is the off-grid grid holding this plugin's PARAMETERIZED
  // instances (issue #251) — e.g. ssh's connection wells. A plugin declaring
  // this with an empty root_grid_id is a parameterized plugin: the menu/drop
  // gestures open the instance picker instead of descending. Like
  // scratch_grid_id, it is a storage address, never a landing page. Empty for
  // rooted plugins.
  string instance_grid_id = 14;
  // transit declares that this plugin's ids are CHAINS from another node —
  // a mount, forwarding to a remote gridwell, whose ids arrive already
  // qualified from the remote's perspective. The host's qualification layer
  // prepends one segment instead of applying leaf rules, and the mount
  // cache interposes. Declared by the LOCAL transport binary (which is
  // alive even when its remote isn't) and cached from the spawn-time
  // handshake — the host must never re-derive it from the kind string
  // (charter, 2026-08-15: the host must not know its plugins).
  bool transit = 15;
  // glyph is the plugin's identity glyph for the launcher/menu/ghost faces:
  // "folder", "process", "well", or "" for the generic globe. A declaration,
  // never a kind switch in the client; unknown values also fall back to the
  // globe, so a third-party plugin degrades politely.
  string glyph = 16;
  // menu_entries: the plugin's declared (+) menu additions (issue #258;
  // see MenuEntry). The serving node stamps them onto every grid the
  // plugin serves.
  repeated MenuEntry menu_entries = 17;
}

// Probe reports the definitive presence of one tile. Used for non-
// authoritative listings (proc) where an entry can vanish between List and
// reconcile. A failed read must never sweep a tile — only GONE does.
message ProbeRequest {
  string tile_id = 1;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// (Session streaming is gone — 2026-07-26: the Chromium session is
// host-local; no blob crosses the interface.)

// ─── Shell streaming ──────────────────────────────────────────────────────
// OpenShell replaces the WebSocket /rpc/ShellStream endpoint. Bidirectional:
// raw PTY bytes both ways. First OpenShellRequest binds the tile (data empty);
// then keystrokes flow up / terminal output flows down.

message OpenShellRequest  { string tile_id = 1; bytes data = 2; PTYSize resize = 3; }
message OpenShellResponse { bytes data = 1; }
message PTYSize           { int32 cols = 1; int32 rows = 2; }

// Reads.

message GetGridRequest {
  string grid_id = 1;
}
message GetGridResponse {
  Grid grid = 1;
  repeated Tile tiles = 2;
}

message GetTilePreviewRequest {
  string tile_id = 1;
}
message GetTilePreviewResponse {
  bytes jpeg = 1;
}

// (GetTileContentRequest/Response are gone — ReadContent is the one
// content read.)

// ─── Content streams (2026-07-26 redesign; interface-redesign-plan.md) ──────
// ReadContent / WriteContent are the ONE way content bytes move: values —
// finite, versioned, transactional — as opposed to OpenShell's live wire.
// They replaced the unary content verbs and CreateTileRequest.data at the
// 2026-07-26 contraction — creation is metadata-only; a body follows as a
// write.

// ReadContent streams a tile's content bytes. Chunk 1 carries media_type and
// the tile row version the bytes belong to (the client's save basis — bytes
// and version are paired at the owner, never apart); later chunks carry data
// only. On a leaf-link tile the serving node resolves through link_target_id
// (the one resolution point — callers never reimplement link semantics).
// Plugins whose bodies are not version-edited (fs, proc) send version 0.
message ReadContentRequest {
  string tile_id = 1;
}
message ContentChunk {
  bytes data = 1;
  string media_type = 2; // chunk 1 only
  int64 version = 3;     // chunk 1 only
}

// WriteContent streams a tile's content bytes up. The first message binds
// tile_id and claims the version (optimistic concurrency, checked against the
// row before any byte is accepted); subsequent messages carry data only.
// COMMIT AT CLOSE: the write is transactional — the new value becomes visible
// only when the stream closes cleanly, and a broken stream leaves the old
// value byte-for-byte intact. Version semantics are kind-determined in the
// store's one table: a text body is a content edit (bumps version); a pane
// layout is framing-class (never bumps). Not accepted on link tiles: content
// ops write through the target the caller names explicitly.
message WriteContentRequest {
  string tile_id = 1;
  int64 version = 2;
  bytes data = 3;
}

// ServeContent is the plugin-as-web-server door (2026-08-11): the RPC
// carrier behind the server's HTTP /content/ endpoint. A GET of
// /content/<token>/<tile-id>/<subpath> becomes one ServeContent call routed
// to the tile's owning plugin — through transit hops exactly like
// ReadContent — and the response streams back as the HTTP body. It exists so
// a plugin can present ANY content as web content (an image file, a whole
// HTML page with its relative subresources); the browser side is sandboxed
// by the server (CSP sandbox — opaque origin, no cookies, no RPC reach), so
// a plugin-served page can never act on the user's Gridwell.
//
// GET-only by design. subpath "" is the tile's root page; a non-empty
// subpath is a page-relative resource ("img/cat.png") whose meaning the
// plugin defines. Chunk 1 carries status and media_type; later chunks carry
// data only. A plugin that does not serve web content leaves the RPC
// unimplemented and the door answers 404.
message ServeContentRequest {
  string tile_id = 1;
  string subpath = 2;
}
message ServeContentChunk {
  int64 status = 1;      // chunk 1 only; HTTP status code
  string media_type = 2; // chunk 1 only
  bytes data = 3;
}

// PlaceTile is the single placement writeback: placement is one fact,
// (grid_id, x, y, w, h), and one verb owns it (replaces MoveTile + ResizeTile;
// both coexist during migration). grid_id is the DESTINATION grid — same as
// the tile's current grid for a pure resize. The server refuses overlap, and
// refuses placing a well inside its own subtree by walking ancestors from
// grid_id (a server-derived check; no client-supplied path). Placement never
// crosses a plugin boundary (there is no cross-plugin move — link or clone
// instead).
message PlaceTileRequest {
  string tile_id = 1;
  int64 version = 2;
  string grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
}

// GetTile reads a single tile's metadata. The server's preview + shell
// infrastructure uses it to check a tile's kind without enumerating a grid.
message GetTileRequest {
  string tile_id = 1;
}

// Search is the one generic find verb (issue #244, generalizing #234's
// LocateTile). Every plugin MAY implement it — Unimplemented simply means
// no results. The query is free text with a small selector grammar owned
// by ONE shared parser (internal/rpc.ParseSearchQuery): `id:<tile-id>` is
// an exact-id lookup (what LocateTile was), anything else is
// plugin-interpreted text matching (names, bodies, addresses — whatever
// the plugin's data means). Each result is a PLACE, not just a row: the
// tile plus its containing-well chain from the plugin's root grid
// (outermost first, empty at the root), so a hit can be navigated to and
// its crumbs previewed; snippet/score are optional context and ranking
// for merged displays.
//
// Routing (the server surface): scope routes to one namespace (any
// qualified id — the plugin that owns it answers); an empty scope fans
// out to every configured plugin in config order. A transit plugin (a
// node mount) forwards the query to its remote node's server, which fans
// out again — so an unscoped search recurses through the whole federation
// naturally, and results come back qualified like every other id.
message SearchRequest {
  string query = 1;
  // limit caps the results per answering plugin; 0 = the plugin default.
  int32 limit = 2;
  // scope: server surface only (plugins receive their own namespace's
  // queries with scope already consumed).
  string scope = 3;
}
message SearchResult {
  Tile tile = 1;
  repeated Tile path = 2;
  string snippet = 3;
  double score = 4;
}
message SearchResponse {
  repeated SearchResult results = 1;
}

// (SetTileAltRequest is gone — the versioned rename rides SetTile.rename.)

// (SetPaneLayoutRequest is gone — a pane layout is content bytes and rides
// WriteContent; its framing-class version rule lives in the store's table.)

// (SetContentZoomRequest is gone — content zoom rides SetTile.content_zoom.)

// (The Mount RPC is gone: mounting is a CloneTile of the plugin's node-grid
// link tile, and label agreement is owned by that tile's alt — the condition
// its comment set for removal.)

// ListPlugins enumerates the plugins a node hosts, in config order. The client
// builds the launcher / + menu from it. A leaf plugin returns an empty list.
message ListPluginsRequest {
  // namespace routes the request (remote-menu, 2026-08-16): "" answers
  // for THIS node (the boot handshake, unchanged); a namespace chain
  // ("<transit>" or "<transit>/<conn>/...") peels one segment per hop and
  // forwards to the node it names, so a client can ask "what plugins does
  // the node serving this pane have?" — the + menu inside a remote pane
  // shows THAT node's plugins, exactly as a direct client would see them.
  // Each hop RE-QUALIFIES the response's grid ids with its prefix, like
  // every other transit response; node-local fields (content token, node
  // identity/view) are zeroed on forward — they answer only for the node
  // you asked directly.
  string namespace = 1;
}
message PluginInfo {
  string uuid          = 1;   // the plugin's namespace; child grids are <uuid>/<id>
  string kind          = 2;   // "local", "fs", "proc", "remote"
  string label         = 3;   // display name
  bool   writable      = 4;   // accepts new tiles (primitives can be created in it)
  string root_grid_id  = 5;   // qualified <uuid>/<id> of the plugin's default root
                              // grid; click-enter descends here
  string scratch_grid_id = 6; // qualified <uuid>/<id> of the plugin's off-grid
                              // scratch grid for ephemeral url tiles; "" if none
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport,
  // forwarded verbatim from InfoResponse. Zero means never visited; the
  // client substitutes the default calibrated zoom on enterPlugin.
  double root_view_cx   = 7;
  double root_view_cy   = 8;
  double root_view_zoom = 9;
  // info_error is set when the plugin's Info handshake failed or timed out
  // (a crashed/hung plugin), distinguishing "broken" from "healthy but
  // rootless" — both otherwise present identically as root_grid_id == "".
  // Empty when Info succeeded, regardless of whether it declared a root.
  string info_error = 10;
  // instance_grid_id: qualified <uuid>/<id> of the plugin's parameterized-
  // instance grid (issue #251), forwarded from InfoResponse. Set with an
  // empty root_grid_id it marks the plugin PARAMETERIZED: click/drop opens
  // the instance picker. "" for rooted plugins.
  string instance_grid_id = 11;
  // glyph mirrors InfoResponse.glyph for the client's plugin faces
  // (launcher tile, menu swatch, drag ghost). "" = the generic globe.
  string glyph = 12;
  // menu_entries mirrors InfoResponse.menu_entries with grid targets
  // qualified for the receiver (issue #258): root entries join the
  // plugin's row in the (+) menu.
  repeated MenuEntry menu_entries = 13;
}
message ListPluginsResponse {
  repeated PluginInfo plugins = 1;
  // node_uuid is this node's own durable identity (server.yaml node_id) and
  // node_root_grid_id its plugin-list grid — the launcher the client anchors
  // panes at on boot, qualified "<node_uuid>/0". Every gridwell node exposes
  // the same shape, so a remote node reached through an ssh mount presents
  // its launcher exactly like the local one.
  string node_uuid = 2;
  string node_root_grid_id = 3;
  // shells_disabled: this node refuses shell tiles outright (server.yaml
  // disable_shells) — the client removes the shell primitive from the +
  // palette, and the server refuses CreateTile(kind=shell) and OpenShell no
  // matter which plugin would serve them. A node-level operator fact, so it
  // rides the node handshake, not any per-plugin Info.
  bool shells_disabled = 4;
  // content_token gates the HTTP /content/ door (the ServeContent carrier).
  // Pages served there run sandboxed with an OPAQUE origin, so neither their
  // subresource requests nor the desktop's native views carry the auth
  // cookie — the token rides in the path instead:
  // /content/<content_token>/<tile-id>/<subpath>. Derived from the server
  // password (sha256, its own domain prefix — it can never double as the
  // auth cookie), handed out only on this authenticated handshake, and
  // checked against the CURRENT password like the cookie is. A node-level
  // fact of the LOCAL origin: content URLs are always built against the
  // serving node; federation happens behind the door, over the RPC.
  string content_token = 5;
  // node_root_view_cx/cy/zoom: the NODE GRID's own persisted viewport
  // (2026-08-13, framing audit) — the read side of the node grid's
  // SetRootView, so a client anchored at the node grid can boot back to
  // the framing it left. Zero zoom = never set.
  double node_root_view_cx = 6;
  double node_root_view_cy = 7;
  double node_root_view_zoom = 8;
}

// TileResponse is the shape returned by every tile-producing mutation.
message TileResponse {
  Tile tile = 1;
}

// CreateTileRequest creates one tile of any kind (no version — the tile does
// not exist yet). tile.kind selects which fields are meaningful:
//   well  → child_grid_id set makes an exit well pointing at a grid in another
//           plugin (a qualified "<uuid>/<grid-id>"); empty allocates a fresh
//           interior child grid. alt_text is the exit well's display label.
//   text  → the markdown body rides in data (no blob yet).
//   url   → url_string.
//   shell → no extra fields (the bash session starts only on refresh).
// Only localdb accepts creates; fs/proc/ssh leave this unimplemented.
message CreateTileRequest {
  reserved 1; // path: removed 2026-07-26 (id-addressed; grid_id is authoritative)
  string grid_id = 2;
  Tile   tile    = 3;
  reserved 4; // data: removed 2026-07-26 — one way to write bytes (WriteContent);
              // creation is metadata-only, text/pane bodies follow as a write
}

// ShellSessionAlive reports whether the tile's gridwell-private tmux
// session currently exists. Called on shell descent so the wasm can
// decide whether to show the refresh button:
//   - alive=true             → button shown; refresh attaches.
//   - alive=false, no snap   → button shown; refresh creates fresh.
//   - alive=false, snap set  → button hidden; the JPEG is all that
//     remains (the session died, can't bring it back).
message ShellSessionAliveRequest {
  string tile_id = 1;
}
message ShellSessionAliveResponse {
  bool alive = 1;
}

// Mutations: version is the claimed current version of tile_id; the
// server returns a version-conflict error if it doesn't match.
// (MoveTileRequest/ResizeTileRequest are gone — PlaceTile owns placement.)

message CloneTileRequest {
  reserved 1, 5; // path, dest_path: removed 2026-07-26 (id-addressed; the
                 // subtree copy completes before the insert, so no cycle
                 // can form and no client-supplied location is needed)
  string tile_id = 2;
  int64 version = 3;
  string dest_grid_id = 4;
  int64 x = 6;
  int64 y = 7;
}

// SetTileRequest is the single framing/preview writeback. It is dispatched on
// tile.kind to the one operation that kind supports, and that mapping fixes the
// version semantics (face #3 of the primary rule — framing is not a content
// edit):
//   well  → view_x/view_y/view_zoom              (framing; never bumps version)
//   text  → text_x/text_y/text_w/text_h/text_mode (framing; never bumps version)
//   url   → url_string, alt_text (page title), preview jpeg  (content; bumps)
//   shell → preview jpeg                          (content; bumps version)
// Empty preview/url_string/alt_text fields are skipped so a partial capture
// never clobbers good state. path + version make a content write a proper
// versioned, in-place edit.
message SetTileRequest {
  reserved 1; // path: removed 2026-07-26 (id-addressed)
  string tile_id = 2;
  int64  version = 3;
  Tile   tile    = 4;   // the fields to write for tile.kind
  bytes  preview = 5;   // jpeg to freeze (url/shell)

  // 2026-07-26 (interface-redesign-plan.md): the absorbed scalar writebacks.
  // Exactly ONE operation per call — rename, content_zoom, url_frozen,
  // adopt_child_grid, or the kind-dispatched tile writeback above; a request
  // setting more than one is refused, so the "empty fields are skipped" rule
  // never turns ambiguous.
  //
  // rename is the USER rename gesture (formerly SetTileAlt): sets alt_text
  // and latches alt_user so automatic captures (url page title, shell
  // foreground command) defer from then on. Distinct from tile.alt_text in
  // the url arm, which is the AUTO title capture — two different facts, one
  // column, arbitrated by the alt_user latch in exactly one place
  // (store.SetTileAlt). Now VERSIONED like every user edit (the condition
  // the old SetTileAlt comment set for this fold). Refused for text tiles
  // (their name derives from the first line).
  string rename = 6;
  // content_zoom (formerly SetContentZoom): the per-tile content scale.
  // Framing — never bumps version; refused for wells. optional so presence
  // is explicit (0 is a meaningful "unset" stored value).
  optional double content_zoom = 7;
  // url_frozen: the user's standing freeze on a url tile (issue #237).
  // Framing — never bumps version; refused for non-url tiles. optional so
  // clearing (false) is distinct from absent.
  optional bool url_frozen = 8;
  // adopt_child_grid (issue #251): turn a CHILDLESS well into a link by
  // setting its child grid — the moment an unconfigured plugin well
  // becomes a configured instance link. A versioned user edit (bumps).
  // Refused for non-wells and for wells that already have a child grid: a
  // well's target never silently changes.
  AdoptChildGrid adopt_child_grid = 9;
}

// AdoptChildGrid carries the SetTile adopt arm's payload: the qualified
// child grid plus the same birth fields CreateTile's exit-well arm takes.
// label applies only when the well is unnamed (alt_text empty, alt_user
// unlatched) — the copy-from-source-at-birth naming rule links follow.
message AdoptChildGrid {
  string child_grid_id = 1;
  string label         = 2;
  int64  view_x        = 3;
  int64  view_y        = 4;
  double view_zoom     = 5;
}

// (UpdateTextRequest is gone — text bodies ride WriteContent, whose
// kind-dispatched version rule keeps 'text bumps' in the store's one table.)

message DeleteTileRequest {
  reserved 1; // path: removed 2026-07-26 (id-addressed)
  string tile_id = 2;
  int64 version = 3;
}
message DeleteTileResponse {}

// SetRootViewRequest persists the plugin root grid's viewport (the same
// fact that SetTile writes for a well tile, but for the plugin root which
// has no tile row). root_grid_id routes the call to the owning plugin;
// cx/cy are the viewport center in world cell coords; zoom is the live zoom.
// Framing only — never bumps a content version. localdb stores to the
// frozen system KV table (root_view_*); fs/proc are no-ops.
message SetRootViewRequest {
  string root_grid_id = 1;  // qualified "<plugin-uuid>/<id>", used for routing
  double cx           = 2;
  double cy           = 3;
  double zoom         = 4;
}
message SetRootViewResponse {}

// Event stream.

message SubscribeRequest {}

message GridChanged {
  string grid_id = 1;
}

message TileChanged {
  Tile tile = 1;
}

message TileRemoved {
  string grid_id = 1;
  string tile_id = 2;
}

// EventPluginHealth reports a transition in a plugin's event-stream health, as
// seen by the top-level server's fan-in (fanInEvents / watchPlugin in
// connect_handler.go). Emitted on the down transition (healthy=false, detail =
// the dial/recv/Info error that caused it) and again on recovery
// (healthy=true, detail=""). Not per-retry-attempt — only on a change of
// state, so a flapping plugin doesn't spam the client.
message EventPluginHealth {
  string plugin_uuid = 1;
  bool healthy       = 2;
  string detail       = 3;
}

// Event carries one of the change kinds. The variant tells the client
// what changed; the variant tag IS the discriminator (no separate kind
// string).
message Event {
  oneof payload {
    GridChanged grid_changed = 1;
    TileChanged tile_changed = 2;
    TileRemoved tile_removed = 3;
    EventPluginHealth plugin_health = 4;
  }
}

// Gridwell is the unified RPC surface, implemented by every node: a local
// server, a plugin process, and a remote server reached over SSH.
service Gridwell {
  // ── Lifecycle ───────────────────────────────────────────────────────────
  // Info is the whole handshake (identity + default root); there is no
  // Attach/Detach/Bootstrap. ListPlugins enumerates a node's plugins (the SSH
  // gateway calls it on a remote to learn that node's namespaces).
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);

  // ── Shell (live PTY, both ways) ───────────────────────────────────────────
  rpc OpenShell(stream OpenShellRequest) returns (stream OpenShellResponse);

  // ── Reads ─────────────────────────────────────────────────────────────────
  rpc GetGrid(GetGridRequest)               returns (GetGridResponse);
  rpc GetTile(GetTileRequest)               returns (TileResponse);
  rpc GetTilePreview(GetTilePreviewRequest) returns (GetTilePreviewResponse);
  rpc Search(SearchRequest)                 returns (SearchResponse);

  // ── Content streams (the one way content bytes move; see the messages) ────
  rpc ReadContent(ReadContentRequest)        returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (TileResponse);

  // ── Web content (the HTTP /content/ door's RPC carrier) ──────────────────
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);

  // PlaceTile is the single placement writeback (⇐ MoveTile + ResizeTile).
  rpc PlaceTile(PlaceTileRequest) returns (TileResponse);

  // ── Mutations (one create, one writeback, plus placement) ─────────────────
  rpc CreateTile(CreateTileRequest) returns (TileResponse);
  rpc SetTile(SetTileRequest)       returns (TileResponse);
  rpc CloneTile(CloneTileRequest)   returns (TileResponse);
  rpc DeleteTile(DeleteTileRequest) returns (DeleteTileResponse);

  // SetRootView persists the plugin root-grid framing (the portal-level
  // analogue of SetTile for a well). Framing only — never bumps version.
  // The server routes on root_grid_id; localdb stores; fs/proc are no-ops.
  rpc SetRootView(SetRootViewRequest) returns (SetRootViewResponse);

  // ShellSessionAlive gates the wasm refresh button on shell descent.
  rpc ShellSessionAlive(ShellSessionAliveRequest) returns (ShellSessionAliveResponse);

  rpc Subscribe(SubscribeRequest) returns (stream Event);
}
