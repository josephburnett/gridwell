// data.proto owns Gridwell's wire types and the persisted record shapes. Every
// stored field in Grid and Tile maps 1:1 to a column described by
// internal/local/store/columns.go, and TestDescriptorMatchesProto pins the two
// together in both directions.
//
// Conventions:
//   - kind and text_mode are strings rather than enums. The DDL CHECK
//     constraints already pin the closed sets, and strings keep the
//     proto-to-column mapping mechanical.
//   - created_at and updated_at exist in the DDL but are not on the wire. They
//     are storage metadata.
syntax = "proto3";

package gridwell.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/gridwell/v1;gridwellv1";

// Every mutation is id-addressed; the server derives location facts itself.
// No request carries a descent path.

// Grid is the persistent unit of canvas. Tiles live in grids; wells
// point at child grids. The root grid has no parent.
message Grid {
  string id = 1;
  reserved 2; // object_id
  int64 version = 3;
  reserved 4, 5; // source_kind, source_id
  // writable reports whether the grid's owning plugin accepts mutations.
  // It is per grid, not per namespace, because one connection fronts many
  // remote plugins with differing capabilities. Stamped by the serving node
  // from the owning plugin's Info at a leaf, passed through verbatim in
  // transit. Wire-only, never persisted.
  bool writable = 6;
  // scratch_grid_id is the grid where ephemeral visits opened from this grid
  // land: the owning plugin's own scratch grid, or the serving node's home
  // scratch grid when the plugin declares none. Qualified from the receiver's
  // perspective and chained through mounts, by the same stamping rule as
  // writable. "" only when the owning plugin's Info was unreachable.
  // Wire-only.
  string scratch_grid_id = 7;
  reserved 8; // proxy_endpoint
  reserved 9; // create_schemas
  // stale marks a remembered answer: the source could not answer, or has not
  // confirmed this answer within the cache's freshness window, and a refresh
  // is in flight whose GridChanged follows if it finds drift. Two node-side
  // stampers share the meaning, internal/sourcecache on its serve-first and
  // dark paths and a plugin adapter answering a dark source from the rows it
  // minted. An answer already stamped stale is never remembered. Wire-only,
  // never persisted.
  bool stale = 12;
  // node_ns is the namespace chain of the node serving this grid, from the
  // receiver's perspective: "" for a grid served by the node you are talking
  // to, "<transit>/<conn>" or deeper through mounts, each transit hop
  // prepending its segment as scratch_grid_id does. It is the one owner of
  // which node a pane is inside: the client keys its per-pane + menu context
  // by it and routes Handshake with it. Wire-only, never persisted.
  string node_ns = 10;
  // menu_entries is the owning plugin's declared (+) menu additions for
  // this grid. Stamped from Info by the serving node, and verbatim through
  // transit with grid_id prefixed per hop. Wire-only.
  repeated MenuEntry menu_entries = 11;
  // host_content says this grid projects host state, such as a directory or
  // the process table, instead of holding content of its own. Its rows are
  // read-only and the client renders them with the host treatment: the
  // outside tint and the exit border family. The owning plugin declares it
  // (plugin.v1 InfoResponse.host_content), the adapter that serves the grid
  // stamps it, and transit carries it verbatim as it does writable. A reader
  // consults it instead of learning a kind's name. Wire-only, never
  // persisted.
  bool host_content = 13;
  // glyph is the owning plugin's declared identity glyph for this grid, from
  // the same vocabulary as InfoResponse.glyph ("" = no declaration, and the
  // client falls back to the well face or the mount door's glyph). It
  // travels on the GRID because a plugin-list lookup cannot answer for a
  // grid reached through a mount. Stamped by the adapter, verbatim in
  // transit. Wire-only, never persisted.
  string glyph = 14;
}

// MenuEntry is one declared (+) menu entry: a doorway onto one collection,
// such as the home's trashcan or a mail plugin's Feed. Declared in Info,
// stamped per grid by the serving node as writable is, and passed verbatim
// through transit hops, where grid_id gains the hop prefix like every id. The
// swatch behaves like a menu row's over grid_id: click descends, drag drops an
// exit-well link.
message MenuEntry {
  string id           = 1; // entry identity within the plugin
  string label        = 2; // swatch label, verbatim
  string glyph        = 3; // the declared glyph vocabulary ("" = the kind's default face)
  string color        = 4; // optional CSS accent for the swatch border/glyph ("" = default)
  reserved 5, 6; // kind, param_schema
  string grid_id      = 7; // the target grid, qualified per hop
  // view_cx/cy/zoom is grid_id's last-saved viewport, the same shape and
  // meaning as PluginInfo.root_view_*. A doorway carries the framing of the
  // grid behind it, so re-entering a collection lands where it was left. Zero
  // zoom means never visited and the client substitutes its calibrated
  // default.
  double view_cx      = 8;
  double view_cy      = 9;
  double view_zoom    = 10;
}

// Tile is the persistent unit of content in a grid. kind selects which
// subset of the optional fields is meaningful; the DDL CHECK constraint
// enforces it.
message Tile {
  string id = 1;
  reserved 2; // object_id

  int64 version = 3;
  string grid_id = 4;
  string kind = 5;
  int64 x = 6;
  int64 y = 7;
  int64 w = 8;
  int64 h = 9;

  reserved 10, 11; // view_x, view_y

  // well-only: the child grid's framing, which is at once the preview frame,
  // the descent target and the ascent return value. A float center in the
  // child grid's coordinates (view_cx, view_cy) plus the pane-size-independent
  // intrinsic zoom (live over overtake), the same three numbers a root grid
  // keeps on its own row. view_zoom == 0 means never visited.
  double view_zoom = 12;
  double view_cx = 36;
  double view_cy = 37;
  string child_grid_id = 13;

  // text-only: text_x/text_y is the scroll offset; text_w/text_h is the
  // window size; all four are doc-space px. text_mode is "rendered" or
  // "text". blob_id points at the markdown source in the blobs table.
  int64 text_x = 14;
  int64 text_y = 15;
  int64 text_w = 16;
  int64 text_h = 17;
  string text_mode = 18;
  int64 blob_id = 19;

  // url-only: the http(s) URL plus a pointer at the last-frozen JPEG
  // preview (in the blobs table; hash-deduped across clones).
  string url_string = 20;
  int64 preview_blob_id = 21;

  reserved 22, 23, 24; // fs_path, pid, source_key

  // alt_text is the canonical display label, rendered verbatim by the
  // client. Stamped at insert time (for plugin-owned tiles, the entry name;
  // for an exit well, the mounted plugin's label).
  string alt_text = 25;

  // reference reports that this well is a link: its child_grid_id is a
  // qualified cross-plugin reference rather than a bare local child grid. It
  // is the one signal for that. The client renders a dashed border from it,
  // and delete and clone treat a qualified child_grid_id as unlink-only and
  // share, never cascade. The server sets it in qualifyTiles, from a child
  // that arrived already qualified, so render and the store cannot disagree
  // on what a link is. Wire-only, derived, never a stored column.
  bool reference = 26;

  // content_zoom scales the content rendered inside a text, shell or url tile:
  // the text font, the terminal font, the page zoom. It is framing, persisted
  // per tile, and it never bumps version. 0 means unset and renders at 1.0.
  // Written by the SetTile content_zoom arm only.
  double content_zoom = 27;

  // url_history is a url tile's persisted navigation back-stack, JSON
  // {index, entries:[{url,title}]} and capped, captured at freeze so a
  // revived tile can still go back. Rides the url SetTile writeback. An
  // empty value on a write leaves the stored history untouched, so a
  // partial capture cannot clobber it, mirroring the preview-JPEG rule.
  string url_history = 28;

  // link_target_id makes a leaf tile (text, url, shell, pane) a link: a
  // qualified "<plugin-uuid>/<tile-id>" reference to the tile that owns the
  // content. The link row stores no blob, no url and no preview, and readers
  // resolve bytes, preview and session through the target id, which the router
  // routes anywhere, including through transit chains that prepend one hop
  // segment as they do for a well's qualified child_grid_id. Kind stays the
  // target's kind. A well's link variant is a qualified child_grid_id instead,
  // and reference is the derived bit over both shapes. Deleting a link only
  // unlinks.
  string link_target_id = 29;

  // url_frozen is the user's standing freeze on a url tile: set by the
  // explicit freeze gesture, cleared by the reconnect button. While set,
  // descending does not auto-go-live. The transient navigate-away freeze is
  // separate and auto-revives on return. Framing-class: written by the SetTile
  // url_frozen arm only, and it never bumps version.
  bool url_frozen = 30;

  reserved 31; // configure_plugin_id

  // serves_page: the owning plugin serves this tile's content as web content
  // through the /content/ door, over the ServeContent RPC. The client gives
  // the descent url-tile semantics, a live native view on a desktop host and
  // open-in-new-tab on a browser host, at the derived address
  // /content/<content-token>/<tile-id>/. That address is built at render time
  // from the current origin and never persisted, because ports are ephemeral.
  // Plugin-declared, derived from the content itself, such as the filename's
  // media type in fs. Never a stored column.
  bool serves_page = 32;

  // text_presentation is the owning plugin's declaration of how a text tile's
  // body presents: "plain" for monospace with no markdown interpretation,
  // "rendered" for the document renderer only, or "both" for rendered by
  // default with a toggle to the raw source. "" means no declaration and the
  // stored user text_mode rules, which is the case for the home's own
  // documents. Plugin-derived from the content itself, such as the filename or
  // a sniff in fs. Wire-only, never a stored column.
  string text_presentation = 33;

  reserved 34; // menu_entry

  // status_detail is the owning plugin's word about this tile's state —
  // "unread", "done" — which nothing outside that plugin can derive. The
  // client draws it muted after the name (client/tilebanner) and never
  // instead of it. Plugin-declared through the Entry, wire-only: never a
  // stored column, never set by clients.
  string status_detail = 35;
}

// ─── Plugin / node lifecycle ──────────────────────────────────────────────
// The same RPCs are exposed by a node, a plugin process, and a remote node
// reached over a connection. The client talks to its own node; the node
// routes to plugins and forwards through connections.

// Info is the whole plugin handshake: a plugin loaded from server.yaml is
// already there, so Info reports its identity and its default root grid. There
// is no Attach or Detach. The gRPC connection, opened at load and closed at
// unload, is the only lifecycle.
message InfoRequest {}
message InfoResponse {
  reserved 1; // kind
  string display_name   = 2;
  reserved 3; // schema_version
  reserved 4; // watch
  // root_grid_id is the plugin's default root: fs uses its configured
  // root, proc pid 1, the home its singleton root. Click-enter descends
  // here.
  string root_grid_id   = 5;
  reserved 6; // network
  reserved 7; // has_session
  reserved 13; // create_schemas
  // scratch_grid_id is the plugin's off-grid grid for ephemeral url tiles,
  // where descending into a url places no tile. Never rendered, never
  // mounted; it persists as visited-url history. Empty for plugins that do
  // not support ephemeral visits, such as fs and proc.
  string scratch_grid_id = 8;
  // writable reports that this plugin accepts CreateTile, so new primitives can
  // be dropped into its grids. The plugin declares it once here.
  // A node that re-derived it from the kind string would present a remote
  // plugin reached through a connection as read-only.
  bool writable = 9;
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport: the
  // center in grid coordinates and the intrinsic zoom. The home fills it from
  // its system KV table; a plugin with no persistent root view returns zero.
  // The client seeds the doorway framing from it so re-entry restores the
  // left-off view. It is read-only here; SetFraming is the write path.
  double root_view_cx   = 10;
  double root_view_cy   = 11;
  double root_view_zoom = 12;
  reserved 14; // instance_grid_id
  reserved 15; // transit
  // glyph is the plugin's identity glyph for the menu and ghost faces:
  // "folder", "process", "well", or "" for the generic globe. The client reads
  // the declaration and never switches on the kind, and an unknown value falls
  // back to the globe, so a third-party plugin degrades politely.
  string glyph = 16;
  // menu_entries is the plugin's declared (+) menu additions; see
  // MenuEntry. The serving node stamps them onto every grid the plugin
  // serves.
  repeated MenuEntry menu_entries = 17;
}

// Probe reports the definitive presence of one tile, for non-authoritative
// sources where an entry can vanish between a listing and the reconcile. A
// failed read must never sweep a tile; only GONE does.
message ProbeRequest {
  string tile_id = 1;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// ─── Shell streaming ──────────────────────────────────────────────────────
// OpenShell is bidirectional: raw PTY bytes both ways. The first
// OpenShellRequest binds the tile, with data empty; then keystrokes flow up
// and terminal output flows down.

message OpenShellRequest  { string tile_id = 1; bytes data = 2; PTYSize resize = 3; }
message OpenShellResponse { bytes data = 1; }
message PTYSize           { int32 cols = 1; int32 rows = 2; }

// Reads.

message GetGridRequest {
  string grid_id = 1;
}
message GetGridResponse {
  Grid grid = 1;
  repeated Tile tiles = 2;
}

message GetTilePreviewRequest {
  string tile_id = 1;
}
message GetTilePreviewResponse {
  bytes jpeg = 1;
}

// ─── Content streams ──────────────────────────────────────────────────────
// ReadContent and WriteContent are the one way content bytes move: finite,
// versioned, transactional values. OpenShell is the live wire instead.
// Creation is metadata-only and a body follows as a write.

// ReadContent streams a tile's content bytes. Chunk 1 carries media_type and
// the tile row version the bytes belong to, which is the client's save basis,
// so bytes and version are paired at the owner. Later chunks carry data only.
// On a leaf-link tile the serving node resolves through link_target_id, the one
// resolution point, so callers never reimplement link semantics. A plugin whose
// bodies are not version-edited sends version 0.
message ReadContentRequest {
  string tile_id = 1;
}
message ContentChunk {
  bytes data = 1;
  string media_type = 2; // chunk 1 only
  int64 version = 3;     // chunk 1 only
}

// WriteContent streams a tile's content bytes up. The first message binds
// tile_id and claims the version, checked against the row before any byte is
// accepted; subsequent messages carry data only. The write commits at close, so
// the new value becomes visible only when the stream closes cleanly and a broken
// stream leaves the old value byte-for-byte intact. Version semantics are
// kind-determined in the store's one table: a text body is a content edit that
// claims and bumps, while a pane layout is framing-class with no claim and no
// bump. Not accepted on link tiles, because a content operation writes through
// the target the caller names explicitly.
message WriteContentRequest {
  string tile_id = 1;
  int64 version = 2;
  bytes data = 3;
}

// ServeContent is the RPC carrier behind the server's HTTP /content/ endpoint.
// A GET of /content/<token>/<tile-id>/<subpath> becomes one ServeContent call
// routed to the tile's owning plugin, through transit hops as ReadContent is,
// and the response streams back as the HTTP body. A plugin can present any
// content as web content this way, from an image file to a whole HTML page with
// its relative subresources. The server sandboxes the browser side with a CSP
// sandbox: opaque origin, no cookies, no RPC reach, so a plugin-served page can
// never act on the user's Gridwell.
//
// GET-only. subpath "" is the tile's root page; a non-empty subpath is a
// page-relative resource such as "img/cat.png" whose meaning the plugin defines.
// Chunk 1 carries status and media_type; later chunks carry data only. A plugin
// that does not serve web content leaves the RPC unimplemented and the door
// answers 404.
message ServeContentRequest {
  string tile_id = 1;
  string subpath = 2;
}
message ServeContentChunk {
  int64 status = 1;      // chunk 1 only; HTTP status code
  string media_type = 2; // chunk 1 only
  bytes data = 3;
}

// PlaceTile is the single placement writeback. Placement is one fact,
// (grid_id, x, y, w, h), and one verb owns it. grid_id is the destination grid,
// the same as the tile's current grid for a pure resize. The server refuses
// overlap, and refuses placing a well inside its own subtree by walking
// ancestors from grid_id, with no client-supplied path. Placement never crosses
// a plugin boundary; there is no cross-plugin move, only link or clone.
message PlaceTileRequest {
  string tile_id = 1;
  reserved 2; // version
  string grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
}

// GetTile reads a single tile's metadata. The server's preview + shell
// infrastructure uses it to check a tile's kind without enumerating a grid.
message GetTileRequest {
  string tile_id = 1;
}

// Search is the one generic find verb. Every plugin may implement it, and
// Unimplemented means no results. The query is free text with a small selector
// grammar owned by one shared parser (rpc.ParseSearchQuery): id:<tile-id> is an
// exact-id lookup, and anything else is plugin-interpreted text matching
// against names, bodies, addresses, or whatever the plugin's data means. Each
// result carries the tile plus its containing-well chain from the plugin's root
// grid, outermost first and empty at the root, so a hit can be navigated to and
// its crumbs previewed. snippet and score are optional context and ranking for
// merged displays.
//
// On the server surface, scope routes to one namespace and the plugin that owns
// that qualified id answers; an empty scope fans out to every configured plugin
// in config order. A transit hop forwards the query to the remote node, which
// fans out again, so an unscoped search recurses through every connected node
// and results come back qualified like every other id.
message SearchRequest {
  string query = 1;
  // limit caps the results per answering plugin; 0 means the plugin's
  // default.
  int32 limit = 2;
  // scope: server surface only (plugins receive their own namespace's
  // queries with scope already consumed).
  string scope = 3;
}
message SearchResult {
  Tile tile = 1;
  repeated Tile path = 2;
  string snippet = 3;
  double score = 4;
}
message SearchResponse {
  repeated SearchResult results = 1;
}

// Handshake enumerates the plugins a node hosts, in config order. The client
// builds the + menu from it. A leaf plugin returns an empty list.
message HandshakeRequest {
  // namespace routes the request. "" answers for this node, which is the
  // boot handshake; a namespace chain ("<transit>" or "<transit>/<conn>/…")
  // peels one segment per hop and forwards to the node it names, so the +
  // menu inside a remote pane shows that node's plugins exactly as a direct
  // client would see them. Each hop re-qualifies the response's grid ids
  // with its prefix, like every other transit response, and node-local
  // fields (content token, node identity and view) are zeroed on forward:
  // they answer only for the node you asked directly.
  string namespace = 1;
}
message PluginInfo {
  string uuid          = 1;   // the plugin's namespace; child grids are <uuid>/<id>
  string kind          = 2;   // "home", "fs", "proc", "connection"
  string label         = 3;   // display name
  bool   writable      = 4;   // accepts new tiles (primitives can be created in it)
  string root_grid_id  = 5;   // qualified <uuid>/<id> of the plugin's default root
                              // grid; click-enter descends here
  string scratch_grid_id = 6; // qualified <uuid>/<id> of the plugin's off-grid
                              // scratch grid for ephemeral url tiles; "" if none
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport,
  // forwarded verbatim from InfoResponse. Zero means never visited; the
  // client substitutes the default calibrated zoom on enterPlugin.
  double root_view_cx   = 7;
  double root_view_cy   = 8;
  double root_view_zoom = 9;
  // info_error is set when the plugin's Info handshake failed or timed out,
  // distinguishing broken from healthy but rootless, which otherwise
  // present identically as root_grid_id == "". Empty when Info succeeded,
  // whether or not it declared a root.
  string info_error = 10;
  reserved 11; // instance_grid_id
  // glyph mirrors InfoResponse.glyph for the client's plugin faces: the
  // menu swatch and the drag ghost. "" is the generic globe.
  string glyph = 12;
  // menu_entries mirrors InfoResponse.menu_entries with grid targets
  // qualified for the receiver: root entries join the plugin's row in the
  // (+) menu.
  repeated MenuEntry menu_entries = 13;
}
// ConnectionInfo is one of the node's connections as the handshake lists
// it: a row in the + menu that descends into the remote node's home. uuid
// is "<node id>/<connection name>", the namespace every reference through
// the connection carries.
message ConnectionInfo {
  string uuid          = 1;
  string label         = 2;
  string root_grid_id  = 3;   // the remote's home, qualified; "" while pending
  double root_view_cx   = 4;  // the remote home's persisted view (zero = unknown)
  double root_view_cy   = 5;
  double root_view_zoom = 6;
  string status_detail = 7;   // the last dial/learn failure while pending
}
message HandshakeResponse {
  reserved 2, 3, 6, 7, 8; // a node grid's identity and viewport
  // plugins: the node's home (first) and its content plugins.
  repeated PluginInfo plugins = 1;
  // home_grid_id is where a client lands ("/"): the home's root grid,
  // qualified. It is a field, never derived from row order. home_view_* is
  // its persisted viewport, and zero zoom means never set.
  string home_grid_id   = 9;
  double home_view_cx   = 10;
  double home_view_cy   = 11;
  double home_view_zoom = 12;
  // connections: the node's remote nodes, in config order.
  repeated ConnectionInfo connections = 13;
  // shells_disabled: this node refuses shell tiles outright, from server.yaml's
  // disable_shells. The client removes the shell primitive from the + palette,
  // and the server refuses CreateTile(kind=shell) and OpenShell whichever
  // plugin would serve them. It is a node-level operator fact, so it rides the
  // node handshake rather than any per-plugin Info.
  bool shells_disabled = 4;
  // content_token gates the HTTP /content/ door, the ServeContent carrier.
  // Pages served there run sandboxed with an opaque origin, so neither their
  // subresource requests nor the desktop's native views carry the auth cookie.
  // The token rides in the path instead, as
  // /content/<content_token>/<tile-id>/<subpath>. It is derived from the server
  // password by sha256 under its own domain prefix, so it can never double as
  // the auth cookie; it is handed out only on this authenticated handshake and
  // checked against the current password as the cookie is. It is a node-level
  // fact of the local origin: content URLs are always built against the serving
  // node, and a connection is followed behind the door, over the RPC.
  string content_token = 5;
}


// TileResponse is the shape returned by every tile-producing mutation.
message TileResponse {
  Tile tile = 1;
}

// CreateTileRequest creates one tile of any kind. There is no version: the
// tile does not exist yet. tile.kind selects which fields are meaningful:
//   well  → child_grid_id set makes an exit well pointing at a grid in
//           another plugin, a qualified "<uuid>/<grid-id>"; empty allocates
//           a fresh interior child grid. alt_text is the well's label.
//   text  → the body follows as a WriteContent.
//   url   → url_string.
//   shell → no extra fields.
// A plugin that does not accept creates leaves this unimplemented.
message CreateTileRequest {
  reserved 1; // path
  string grid_id = 2;
  Tile   tile    = 3;
  reserved 4; // data
}

// ShellSessionAlive reports whether the tile's Gridwell-private tmux
// session currently exists. Called on shell descent so the client can
// decide whether to show the refresh button:
//   - alive=true             → button shown; refresh attaches.
//   - alive=false, no snap   → button shown; refresh creates fresh.
//   - alive=false, snap set  → button hidden; the JPEG is all that
//     remains (the session died, can't bring it back).
message ShellSessionAliveRequest {
  string tile_id = 1;
}
message ShellSessionAliveResponse {
  bool alive = 1;
}

// Mutations. A version claim rides only the writes that change the user's
// content bytes — WriteContent and SetTile's rename arm — and the server
// returns a version-conflict error when it does not match. Layout, framing,
// and capture writes carry no claim at all.

message CloneTileRequest {
  reserved 1, 5; // path, dest_path
  string tile_id = 2;
  reserved 3; // version
  string dest_grid_id = 4;
  int64 x = 6;
  int64 y = 7;
}

// SetTileRequest is the single framing and capture writeback, dispatched on
// tile.kind to the one operation that kind supports:
//   text  → text_x/text_y/text_w/text_h/text_mode  (framing)
//   url   → url_string, alt_text (page title), preview jpeg, url_history
//                                                 (automatic capture)
//   shell → preview jpeg                          (automatic capture)
// Well framing is not here: SetFraming is the one verb for both rows that
// can own it, doorway tile and root grid alike.
//
// Nothing this message can write is a user content edit, so no arm bumps the
// version and no arm carries a claim, apart from rename. Empty preview,
// url_string, and alt_text fields are skipped so a partial capture never
// clobbers good state.
message SetTileRequest {
  reserved 1; // path
  string tile_id = 2;
  // version is the rename arm's claim, and only that arm's: a rename is the
  // user typing a name, the one user content edit this message carries.
  // Every other arm leaves it zero and the server ignores it.
  int64  version = 3;
  Tile   tile    = 4;   // the fields to write for tile.kind
  bytes  preview = 5;   // jpeg to freeze (url/shell)

  // The scalar writebacks. Exactly one operation per call: rename,
  // content_zoom, url_frozen, or the kind-dispatched tile writeback above.
  // A request setting more than one is refused, so the "empty fields are
  // skipped" rule never turns ambiguous.
  //
  // rename is the user's rename gesture: it sets alt_text and latches alt_user
  // so an automatic capture, such as a url page title or a shell foreground
  // command, defers from then on. tile.alt_text in the url arm is that
  // automatic capture. The two facts share one column and store.SetTileAlt is
  // the one place the alt_user latch arbitrates them. Versioned like every
  // user edit. Refused for text tiles, whose name derives from the first line.
  string rename = 6;
  // content_zoom is the per-tile content scale. Framing: no claim, and it never
  // bumps version. Refused for wells. optional so presence is explicit,
  // because 0 is a meaningful stored value.
  optional double content_zoom = 7;
  // url_frozen is the user's standing freeze on a url tile. Framing: no
  // claim, and it never bumps version. Refused for non-url tiles. optional
  // so clearing (false) is distinct from absent.
  optional bool url_frozen = 8;
  reserved 9; // adopt_child_grid
}

message DeleteTileRequest {
  reserved 1; // path
  string tile_id = 2;
  reserved 3; // version
}
message DeleteTileResponse {}

// SetFramingRequest is the one framing verb: how a grid looked when the user
// left it through a given doorway. cx and cy are a float center in the grid's
// own coordinates; zoom is the pane-size-independent intrinsic ratio (live over
// overtake), so a window resize never moves a saved view. Zoom 0 means never
// visited.
//
// Exactly one target is set, and that target also routes the call to the owning
// plugin. tile_id names the doorway tile a grid was entered through, interior
// or exit or link, each doorway keeping its own framing; root_grid_id names a
// root grid, which has no doorway to carry it.
//
// Framing carries no version claim and makes no version bump; it is
// last-writer-wins. A plugin that keeps no framing answers Unimplemented, which
// the node treats as nothing to store rather than an error.
message SetFramingRequest {
  string tile_id      = 1;  // qualified "<plugin-uuid>/<id>"; the doorway
  string root_grid_id = 2;  // qualified "<plugin-uuid>/<id>"; a root grid
  reserved 3; // version
  double cx           = 4;
  double cy           = 5;
  double zoom         = 6;
}
// SetFramingResponse carries the updated doorway tile, so the client can
// reconcile its row. A root write has no tile and leaves it unset.
message SetFramingResponse {
  Tile tile = 1;
}

// Event stream.

message SubscribeRequest {}

message GridChanged {
  string grid_id = 1;
}

message TileChanged {
  Tile tile = 1;
}

message TileRemoved {
  string grid_id = 1;
  string tile_id = 2;
}

// EventPluginHealth reports a transition in a plugin's event-stream health, as
// the router's fan-in sees it (watchPlugin in internal/server/router.go,
// over namespace.Refollow). It is emitted on the down transition, with
// healthy=false and detail carrying the dial, recv or Info error that caused
// it, and again on recovery with healthy=true and detail="". Only on a change
// of state, so a flapping plugin does not spam the client.
message EventPluginHealth {
  string plugin_uuid = 1;
  bool healthy       = 2;
  string detail       = 3;
}

// Event carries one of the change kinds. The variant tag is the discriminator.
message Event {
  oneof payload {
    GridChanged grid_changed = 1;
    TileChanged tile_changed = 2;
    TileRemoved tile_removed = 3;
    EventPluginHealth plugin_health = 4;
  }
}

// Gridwell is the unified RPC surface, implemented by every node and by
// every plugin.
service Gridwell {
  // ── Lifecycle ───────────────────────────────────────────────────────────
  // Info is the whole handshake: identity plus the default root. Handshake
  // enumerates a node's plugins; the transport calls it on a remote to learn
  // that node's namespaces.
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // ── Shell (live PTY, both ways) ───────────────────────────────────────────
  rpc OpenShell(stream OpenShellRequest) returns (stream OpenShellResponse);

  // ── Reads ─────────────────────────────────────────────────────────────────
  rpc GetGrid(GetGridRequest)               returns (GetGridResponse);
  rpc GetTile(GetTileRequest)               returns (TileResponse);
  rpc GetTilePreview(GetTilePreviewRequest) returns (GetTilePreviewResponse);
  rpc Search(SearchRequest)                 returns (SearchResponse);

  // ── Content streams (the one way content bytes move; see the messages) ────
  rpc ReadContent(ReadContentRequest)        returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (TileResponse);

  // ── Web content (the HTTP /content/ door's RPC carrier) ──────────────────
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);

  // PlaceTile is the single placement writeback.
  rpc PlaceTile(PlaceTileRequest) returns (TileResponse);

  // ── Mutations (one create, one writeback, plus placement) ─────────────────
  rpc CreateTile(CreateTileRequest) returns (TileResponse);
  rpc SetTile(SetTileRequest)       returns (TileResponse);
  rpc CloneTile(CloneTileRequest)   returns (TileResponse);
  rpc DeleteTile(DeleteTileRequest) returns (DeleteTileResponse);

  // SetFraming persists the framing of a grid: onto the doorway tile it was
  // entered through, or onto the grid row itself for a root that has no
  // doorway. One verb, one shape, both rows.
  rpc SetFraming(SetFramingRequest) returns (SetFramingResponse);

  // ShellSessionAlive gates the client's refresh button on shell descent.
  rpc ShellSessionAlive(ShellSessionAliveRequest) returns (ShellSessionAliveResponse);

  rpc Subscribe(SubscribeRequest) returns (stream Event);
}
