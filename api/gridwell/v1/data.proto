// data.proto owns Gridwell's wire types and the persisted record shapes. Every
// stored field in Grid and Tile maps 1:1 to a column described by
// internal/local/store/columns.go, and TestDescriptorMatchesProto pins the two
// together in both directions.
//
// Conventions:
//   - kind and text_mode are strings rather than enums. The DDL CHECK
//     constraints already pin the closed sets, and strings keep the
//     proto-to-column mapping mechanical.
//   - created_at, updated_at and content_at exist in the DDL and not on the
//     wire; Find filters on them.
syntax = "proto3";

package gridwell.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/gridwell/v1;gridwellv1";

// Every mutation is id-addressed; the server derives location facts itself.
// No request carries a descent path.

// Grid is the persistent unit of canvas. Tiles live in grids; doors
// point at child grids. The root grid has no parent.
message Grid {
  string id = 1;
  reserved 2; // object_id
  int64 version = 3;
  reserved 4, 5; // source_kind, source_id
  // writable: this grid's text bodies accept edits (WriteContent), so the
  // client lets the user type into its text tiles. The owning namespace
  // stamps it on every grid it serves, the home always and a plugin's from
  // plugin.v1 InfoResponse.writable, and transit carries it verbatim. It is
  // per grid, not per namespace, because one connection fronts namespaces
  // that differ. Wire-only, never persisted.
  bool writable = 6;
  // scratch_grid_id is the grid where ephemeral visits opened from this grid
  // land: the serving node's scratch grid, home's, whatever namespace this
  // grid is in. Qualified from the receiver's perspective and chained through
  // connections. "" only when home's Info was unreachable. Wire-only.
  string scratch_grid_id = 7;
  reserved 8; // proxy_endpoint
  reserved 9; // create_schemas
  // The client derives "this grid is served from cache" from the health of the source
  // serving it: one fact, client/cache.SourceDark.
  reserved 12; // stale
  // node_ns is the namespace chain of the node serving this grid, from the
  // receiver's perspective: "" for a grid served by the node you are talking
  // to, "<transit>/<conn>" or deeper through connections, each transit hop
  // prepending its segment as scratch_grid_id does. It is the one owner of
  // which node a pane is inside: the client keys its per-pane + menu context
  // by it and routes Handshake with it. Wire-only, never persisted.
  string node_ns = 10;
  // plugin_grids is the grids the owning plugin declares as (+) menu rows,
  // stamped on this grid. Stamped from Info by the serving node, and verbatim
  // through transit with grid_id prefixed per hop. Wire-only.
  repeated PluginGrid plugin_grids = 11;
  // host_content says this grid projects host state, such as a directory or
  // the process table, instead of holding content of its own, and the client
  // renders its rows with the host treatment: the outside tint and the
  // border family of a door to another namespace. The owning plugin declares it (plugin.v1
  // InfoResponse.host_content), the adapter that serves the grid stamps it,
  // and transit carries it verbatim. A reader consults it instead of
  // learning a kind's name. Wire-only, never persisted.
  bool host_content = 13;
  // glyph is the owning plugin's declared identity glyph for this grid, from
  // the same vocabulary as InfoResponse.glyph ("" = no declaration, and the
  // client falls back to the door glyph or the glyph of the door to another
  // namespace). It
  // travels on the GRID because a plugin-list lookup cannot answer for a
  // grid reached through a door to another namespace. Stamped by the adapter, verbatim in
  // transit. Wire-only, never persisted.
  string glyph = 14;
  // source_label is the owning plugin's name for what backs this grid, as
  // its listing answered it (plugin.v1 ListResponse.source_label: a
  // directory path, "Inbox · 12 unread"); the bar shows it while a pane
  // stands on the grid. Like the rows, it is a cache of the source, not a
  // node fact, so gridwell.db never holds it. Stamped by the adapter,
  // verbatim in transit. Wire-only.
  string source_label = 15;
  // accepts_tiles: this grid takes new tiles (CreateTile), so the + menu
  // offers its primitives and a swatch drops into it, and its url rows'
  // titles and trails are the node's to write. The owning namespace stamps it on
  // every grid it serves, true for the home and false for a plugin, which
  // creates nothing; transit carries it verbatim. It is absent only from a
  // node built before it split from writable, whose one bit said both, and
  // rpc.TransitQualifyGrid reads that bit for it. Wire-only.
  optional bool accepts_tiles = 16;
  // selection is the set of this grid's tiles the user has in hand: a node
  // fact on the grid row of the namespace that owns the grid, persisted,
  // written only by SetSelection, told whole by SelectionChanged. It names only
  // tiles on this grid, and its order means nothing. Each id is qualified
  // per hop like the tiles'.
  repeated string selection = 17;
  // moves: a tile of this grid moves to another grid of its namespace
  // (MoveTile), so a left-drag there is a move. The owning namespace stamps
  // it on every grid it serves, true for the home and a plugin's from
  // plugin.v1 InfoResponse.move; transit carries it verbatim. It is absent
  // only from a node built before it, where a grid moved unless it was
  // host_content, and rpc.TransitQualifyGrid reads that for it. Wire-only.
  optional bool moves = 18;
}

// PluginGrid is one declared (+) menu row: a door onto one grid a namespace
// declares, such as the home's trashcan or a mail plugin's Feed. Declared in Info,
// stamped per grid by the serving node, and passed verbatim
// through transit hops, where grid_id gains the hop prefix like every id. The
// swatch behaves like a menu row's over grid_id: click descends, drag drops an
// door to another namespace link.
message PluginGrid {
  string id           = 1; // identity within the plugin
  string label        = 2; // swatch label, verbatim
  string glyph        = 3; // the declared glyph vocabulary ("" = the kind's default glyph)
  reserved 4, 5, 6; // color, kind, param_schema
  string grid_id      = 7; // the target grid, qualified per hop
  // view_cx/cy/zoom is grid_id's last-saved viewport, the same shape and
  // meaning as PluginInfo.root_view_*. A door carries the framing of the
  // grid behind it, so re-entering the grid lands where it was left. All
  // three are absent when never visited (rpc.ViewOf), and the client
  // substitutes its calibrated default.
  double view_cx      = 8;
  double view_cy      = 9;
  double view_zoom    = 10;
}

// Tile is the persistent unit of content in a grid. kind selects which
// subset of the optional fields is meaningful; the DDL CHECK constraint
// enforces it.
message Tile {
  string id = 1;
  reserved 2; // object_id

  int64 version = 3;
  string grid_id = 4;
  string kind = 5;
  int64 x = 6;
  int64 y = 7;
  int64 w = 8;
  int64 h = 9;

  reserved 10, 11; // view_x, view_y

  // door-only: the child grid's framing, which is at once the preview frame,
  // the descent target and the ascent return value. A float center in the
  // child grid's coordinates (view_cx, view_cy) plus the pane-size-independent
  // intrinsic zoom (live over overtake), the same three numbers a root grid
  // keeps on its own row. All three are absent when never visited.
  double view_zoom = 12;
  double view_cx = 36;
  double view_cy = 37;
  string child_grid_id = 13;

  // text-only: text_x/text_y is the scroll offset in doc-space px;
  // text_w/text_h are dead storage (see the store's columns.go). text_mode is
  // "rendered" or "text". blob_id points at the markdown source in the blobs table.
  int64 text_x = 14;
  int64 text_y = 15;
  int64 text_w = 16;
  int64 text_h = 17;
  string text_mode = 18;
  int64 blob_id = 19;

  // url-only: the http(s) URL plus a pointer at the last-frozen JPEG
  // preview (in the blobs table; hash-deduped across copies).
  string url_string = 20;
  // preview_blob_id is the preview's cache key, 0 for none, and GetTilePreview
  // answers it. A plugin tile with no screenshot yet keys its plugin's
  // picture below zero; the client only compares keys.
  int64 preview_blob_id = 21;

  reserved 22, 23, 24; // fs_path, pid, source_key

  // alt_text is the canonical display label, rendered verbatim by the
  // client. Stamped at insert time (for plugin-owned tiles, the entry name;
  // for a door to another namespace, the label of the plugin it leads to).
  string alt_text = 25;

  // link reports that this door is a link: its child_grid_id is a
  // qualified cross-plugin link rather than a bare local child grid. It
  // is the one signal for that. The client renders a dashed border from it,
  // and delete and copy treat a qualified child_grid_id as unlink-only and
  // share, never cascade. The server sets it in qualifyTiles, from a child
  // that arrived already qualified, so render and the store cannot disagree
  // on what a link is. Wire-only, derived, never a stored column.
  bool link = 26;

  // content_zoom scales the content rendered inside a text, shell or url tile:
  // the text font, the terminal font, the page zoom. It is framing, persisted
  // per tile, and it never bumps version. 0 means unset and renders at 1.0.
  // Written by the SetTile content_zoom arm only.
  double content_zoom = 27;

  // url_history is a url tile's persisted navigation back-stack, JSON
  // {index, entries:[{url,title}]} and capped, captured at freeze so a
  // revived tile can still go back. Rides the url SetTile writeback. An
  // empty value on a write leaves the stored history untouched, so a
  // partial capture cannot clobber it, mirroring the preview-JPEG rule.
  string url_history = 28;

  // link_target_id makes a leaf tile (text, url, shell, workspace) a link: a
  // qualified "<plugin-uuid>/<tile-id>" link to the tile that owns the
  // content. The link row stores no blob, no url and no preview, and readers
  // resolve bytes, preview and tmux through the target id, which the router
  // routes anywhere, including through transit chains that prepend one hop
  // segment as they do for a door's qualified child_grid_id. Kind stays the
  // target's kind. A door's link variant is a qualified child_grid_id instead,
  // and link is the derived bit over both shapes. Deleting a link only
  // unlinks.
  string link_target_id = 29;

  // url_frozen is the user's standing freeze on a tile that can go live, url
  // or shell: set by the explicit freeze gesture, cleared by the reconnect
  // button. While set, descending does not auto-go-live, and the preview is
  // what the tile keeps looking like. The name is from before a shell could be
  // frozen and cannot be renamed. The transient navigate-away freeze is
  // separate and auto-revives on return. Framing-class: written by the SetTile
  // url_frozen arm only, and it never bumps version.
  bool url_frozen = 30;

  reserved 31; // configure_plugin_id

  // serves_page: this url tile opens at the address the node derives for its
  // /content/ API, /content/<content-token>/<tile-id>/, where the owning
  // plugin answers ServeContent. It stands in place of a url_string of its
  // own, and it is built at render time from the current origin and never
  // persisted, because ports are ephemeral. Url tiles only: the plugin entry
  // API refuses the declaration on every other kind, so a text tile never
  // serves one. Plugin-declared, derived from the content itself, such as the
  // filename's media type in fs. Never a stored column.
  bool serves_page = 32;

  // text_presentation is the owning plugin's declaration of how a text tile's
  // body presents: "plain" for monospace with no markdown interpretation, or
  // "both" for rendered by default with a toggle to the raw source. There is
  // no document-only value: the user can always reach the source bytes. "" is
  // no declaration and the stored user text_mode rules, as for the home's own
  // documents. Plugin-derived from the content itself, such as the filename or
  // a sniff in fs. Wire-only, never a stored column.
  string text_presentation = 33;

  reserved 34; // menu_entry

  // status_detail is the owning plugin's one emoji about this tile's state,
  // set only when there is something to notice, which nothing outside that
  // plugin can derive. The client draws it before the name
  // (tilepreview.BannerText) and never instead of it. Plugin-declared through
  // the Entry, wire-only: never a stored column, never set by clients.
  string status_detail = 35;

  // shell_tmux names the tmux a shell tile attaches: the id of the tile
  // that started it, set on a copy so every copy shares its source's tmux.
  // Empty means the tile's own id; rpc.ShellTmux reads it. Stored,
  // qualified and peeled like the tile's own id, and never set by clients.
  string shell_tmux = 38;

  // content_stamp is the source's name for the bytes behind a row with no
  // version claim (a plugin's): plugin.v1 Entry.content_stamp, carried by the
  // adapter and verbatim in transit, "" when the source names none. It does
  // for such a row what version does for a home row: a body read under
  // another stamp is behind it, and one read under this stamp is not.
  // Wire-only, never a stored column.
  string content_stamp = 39;

  // read_only is the owning plugin's sentence for why this text tile's body
  // takes no edits though its grid is writable, "" when it takes them:
  // plugin.v1 Entry.read_only, carried by the adapter and verbatim in
  // transit. The client shows such a body as it shows any read-only text
  // (textedit.ReadOnly). Wire-only, never a stored column.
  string read_only = 40;

  // named: alt_text was typed, by the rename gesture, so no capture or
  // listing replaces it. Stored as the store's alt_user; only a rename sets
  // it, a copy carries it, and CreateTile honours it. SetTile ignores it.
  bool named = 41;

  // presented_by is the namespace of the plugin presenting this url tile's
  // address in place of the site, "" for none: the verdict of the routes of
  // the node holding the row over the plugins' presents (rpc.Decide); the
  // tile opens at the plugin's page for it. Wire-only, derived, never a
  // stored column.
  string presented_by = 42;
}

// ─── Plugin / node lifecycle ──────────────────────────────────────────────
// The same RPCs are exposed by a node, a plugin process, and a remote node
// reached over a connection. The client talks to its own node; the node
// routes to plugins and forwards through connections.

// Info is the whole plugin handshake: a plugin loaded from server.yaml is
// already there, so Info reports its identity and its default root grid. There
// is no Attach or Detach. The gRPC connection, opened at load and closed at
// unload, is the only lifecycle.
message InfoRequest {}
message InfoResponse {
  reserved 1; // kind
  string display_name   = 2;
  reserved 3; // schema_version
  reserved 4; // watch
  // root_grid_id is the home's root grid. A plugin declares none, since a
  // plugin is not a place; a connection answers the far home's.
  string root_grid_id   = 5;
  reserved 6; // network
  reserved 7; // has_session
  reserved 13; // create_schemas
  // scratch_grid_id is home's off-grid grid for ephemeral visits, where
  // descending into a url places no tile; the node stamps it on every grid
  // it serves as Grid.scratch_grid_id. Never rendered, never linked; it
  // persists as visited-url history. A plugin answers none.
  string scratch_grid_id = 8;
  reserved 9; // writable; the namespace stamps Grid.accepts_tiles and Grid.writable
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport: the
  // center in grid coordinates and the intrinsic zoom. The home fills it from
  // its root grid row; a root never visited leaves all three absent.
  // The client seeds the door framing from it so re-entry restores the
  // left-off view. It is read-only here; SetFraming is the write path.
  double root_view_cx   = 10;
  double root_view_cy   = 11;
  double root_view_zoom = 12;
  reserved 14; // instance_grid_id
  reserved 15; // transit
  // glyph is the plugin's identity glyph for the menu and the ghost:
  // "folder", "process", "door", or "" for the generic globe. The client reads
  // the declaration and never switches on the kind, and an unknown value falls
  // back to the globe, so a third-party plugin degrades politely.
  string glyph = 16;
  // plugin_grids is the grids the plugin declares as (+) menu rows; see
  // PluginGrid. The serving node stamps them onto every grid the plugin
  // serves.
  repeated PluginGrid plugin_grids = 17;
  // presents is the plugin's declared site addresses, as plugin.v1 declares
  // them; home and a connection answer none.
  repeated string presents = 18;
}

// Probe reports the definitive presence of one tile, for non-authoritative
// sources where an entry can vanish between a listing and the reconcile. A
// failed read must never sweep a tile; only GONE does.
message ProbeRequest {
  string tile_id = 1;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// ─── Shell streaming ──────────────────────────────────────────────────────
// OpenShell is bidirectional: raw PTY bytes both ways. The first
// OpenShellRequest binds the tile, with data empty; then keystrokes flow up
// and terminal output flows down.

message OpenShellRequest  { string tile_id = 1; bytes data = 2; PTYSize resize = 3; }
message OpenShellResponse { bytes data = 1; }
message PTYSize           { int32 cols = 1; int32 rows = 2; }

// Reads.

message GetGridRequest {
  string grid_id = 1;
}
message GetGridResponse {
  Grid grid = 1;
  repeated Tile tiles = 2;
}

message GetTilePreviewRequest {
  string tile_id = 1;
}
message GetTilePreviewResponse {
  bytes jpeg = 1;
}

// ─── Content streams ──────────────────────────────────────────────────────
// ReadContent and WriteContent are the one way content bytes move: finite,
// versioned, transactional values. OpenShell is the live wire instead.
// A text or workspace tile may be born with its bytes (CreateTileRequest.content);
// every later change is a write.

// ReadContent streams a tile's content bytes. Chunk 1 carries media_type and
// the tile row version the bytes belong to, which is the client's save basis,
// so bytes and version are paired at the owner. Later chunks carry data only.
// On a leaf-link tile the serving node resolves through link_target_id, the one
// resolution point, so callers never reimplement link semantics. A plugin whose
// bodies are not version-edited sends version 0 and, in its place, the
// bytes' content_stamp (Tile.content_stamp).
message ReadContentRequest {
  string tile_id = 1;
}
message ContentChunk {
  bytes data = 1;
  string media_type = 2;    // chunk 1 only
  int64 version = 3;        // chunk 1 only
  string content_stamp = 4; // chunk 1 only
}

// WriteContent streams a tile's content bytes up. The first message binds
// tile_id and claims the version, checked against the row before any byte is
// accepted; subsequent messages carry data only. The write commits at close, so
// the new value becomes visible only when the stream closes cleanly and a broken
// stream leaves the old value byte-for-byte intact. Version semantics are
// kind-determined in the store's one table: a text body and a pane layout are
// the user's bytes, each claiming and bumping. Not accepted on link tiles, because a content operation writes through
// the target the caller names explicitly.
//
// A row with no version (a plugin's) claims content_stamp instead, the stamp
// its bytes were read under (ContentChunk.content_stamp), which its source
// checks as the store checks a version; the response row carries the stamp
// of the bytes written. A versioned row's owner ignores it.
message WriteContentRequest {
  string tile_id = 1;
  int64 version = 2;
  bytes data = 3;
  string content_stamp = 4;
}

// ServeContent is the RPC carrier behind the server's HTTP /content/ endpoint.
// A GET, HEAD or POST of /content/<token>/<tile-id>/<subpath> becomes one
// ServeContent call routed to the tile's owning plugin, through transit hops as
// ReadContent is, and the response streams back as the HTTP body. A plugin can
// present any content as web content this way, from an image file to a whole
// HTML page with its relative subresources and its forms. The server sandboxes
// the browser side with a CSP sandbox: opaque origin, no cookies, no RPC reach,
// so a plugin-served page can never act on the user's Gridwell.
//
// subpath "" is the tile's root page; a non-empty subpath is a page-relative
// resource such as "img/cat.png" whose meaning the plugin defines. method ""
// means GET. Chunk 1 carries status, media_type and headers; later chunks
// carry data only. A plugin that does not serve web content leaves the RPC
// unimplemented and the content API answers 404.
message ServeContentRequest {
  string tile_id = 1;
  string subpath = 2;
  string method = 3;
  string query = 4; // the raw query string, without its "?"
  repeated Header headers = 5;
  bytes body = 6;
}
message ServeContentChunk {
  int64 status = 1;      // chunk 1 only; HTTP status code
  string media_type = 2; // chunk 1 only
  bytes data = 3;
  // chunk 1 only; written after the node's own, never in place of one.
  repeated Header headers = 4;
}

// Header is one HTTP header line: a name repeated for each of its values.
message Header {
  string name = 1;
  string value = 2;
}

// MoveTile is the single placement writeback. Placement is one fact,
// (grid_id, x, y, w, h), and one verb owns it. grid_id is the destination grid,
// the same as the tile's current grid for a pure resize. The server refuses
// overlap, and refuses moving a door into its own subtree by walking
// ancestors from grid_id, with no client-supplied path. Placement never crosses
// a plugin boundary; there is no cross-plugin move, only link or copy.
//
// claim is the placement the writer saw. A tile no longer there is refused
// with the version conflict, the placement on disk standing. The APIs refuse
// a request with no claim (rpc.UnclaimedWrite); only the node's own writers
// reach a namespace without one.
message MoveTileRequest {
  string tile_id = 1;
  reserved 2; // version
  string grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
  Placement claim = 8;
}

// Placement is where a tile sits: its grid and footprint. As a claim it is
// compared whole, so a tile moved away and back is where the writer saw it.
message Placement {
  string grid_id = 1;
  int64 x = 2;
  int64 y = 3;
  int64 w = 4;
  int64 h = 5;
}

// GetTile reads a single tile's metadata. The server's preview + shell
// infrastructure uses it to check a tile's kind without enumerating a grid.
message GetTileRequest {
  string tile_id = 1;
}

// Find is the one generic find verb. Every plugin may implement it, and
// Unimplemented means no results. The query is free text with a small selector
// grammar owned by one shared parser (rpc.ParseFindQuery): id:<tile-id> is an
// exact-id lookup, and anything else is plugin-interpreted text matching
// against names, bodies, addresses, or whatever the plugin's data means. Each
// result carries the tile plus its containing-door chain from the plugin's root
// grid, outermost first and empty at the root, so a hit can be navigated to and
// its crumbs previewed. snippet and score are optional context and ranking for
// merged displays.
//
// On the server surface, scope routes to one namespace and the plugin that owns
// that qualified id answers, and an id: lookup or a grid_id routes on its id the
// same way; otherwise an empty scope fans out to every configured plugin in
// config order. A transit hop forwards the query to the remote node, which
// fans out again, so an unscoped find recurses through every connected node
// and results come back qualified like every other id.
//
// The filters narrow every hit and AND together. They are the node's, applied
// to the rows it holds, never a plugin's: the plugin API has none. A query may
// be empty when a filter is given, and then every tile passing the filters is
// a hit, the newest first by the time filtered on (created when none is).
message FindRequest {
  string query = 1;
  // limit caps the results per answering plugin; 0 means the plugin's
  // default.
  int32 limit = 2;
  // scope: server surface only (plugins receive their own namespace's
  // queries with scope already consumed).
  string scope = 3;
  // grid_id keeps the hits on this grid.
  string grid_id = 4;
  // recurse, with grid_id, also keeps the hits on the grids of the doors inside
  // it, to any depth. A link door is a path elsewhere and is not followed.
  bool recurse = 5;
  // created, modified and content_changed keep the hits whose row time falls
  // in the range: when it was made, when it was last written by anything (a
  // move, framing, a freeze), and when its content last changed (its version
  // last moved). A tile with no row on its node has no times and passes none.
  TimeRange created = 6;
  TimeRange modified = 7;
  TimeRange content_changed = 8;
  // selected keeps the hits in their grid's selection, the node fact.
  bool selected = 9;
  // kind keeps the hits of this kind: text, url, shell, door or workspace. An
  // entry with no row has its kind, so it passes or fails like a row.
  string kind = 10;
}

// TimeRange is an inclusive range of unix seconds; 0 leaves that end open.
message TimeRange {
  int64 from = 1;
  int64 to = 2;
}
message FindResult {
  Tile tile = 1;
  repeated Tile path = 2;
  string snippet = 3;
  double score = 4;
}
message FindResponse {
  repeated FindResult results = 1;
  // skipped is every namespace a fan-out asked and did not hear from, so a
  // shorter list never passes for a whole one. Unimplemented is no results,
  // not a skip.
  repeated FindSkip skipped = 2;
}
// FindSkip names one namespace a fan-out went without, qualified like a
// health event's plugin_uuid, and why.
message FindSkip {
  string namespace = 1;
  string reason    = 2;
}

// Handshake enumerates the plugins a node hosts, in config order. The client
// builds the + menu from it. A leaf plugin returns an empty list.
message HandshakeRequest {
  // namespace routes the request. "" answers for this node, which is the
  // boot handshake; a namespace chain ("<transit>" or "<transit>/<conn>/…")
  // peels one segment per hop and forwards to the node it names, so the +
  // menu inside a remote pane shows that node's plugins exactly as a direct
  // client would see them. Each hop re-qualifies the response's grid ids
  // with its prefix, like every other transit response, and node-local
  // fields (content token, node identity and view) are zeroed on forward:
  // they answer only for the node you asked directly.
  string namespace = 1;
}
message PluginInfo {
  string uuid          = 1;   // the plugin's namespace; child grids are <uuid>/<id>
  reserved 2;                 // kind; a plugin's kind is config, and nothing switches on it
  string label         = 3;   // display name
  reserved 4;                 // writable; Grid.accepts_tiles and Grid.writable are the facts
  string root_grid_id  = 5;   // qualified <uuid>/<id> of the plugin's default root
                              // grid; click-enter descends here
  reserved 6;                 // scratch_grid_id; Grid.scratch_grid_id is the fact
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport,
  // forwarded verbatim from InfoResponse. Absent when never visited; the
  // client substitutes the default calibrated zoom on enterPlugin.
  double root_view_cx   = 7;
  double root_view_cy   = 8;
  double root_view_zoom = 9;
  // info_error is set when the plugin's Info handshake failed or timed out,
  // distinguishing broken from healthy but rootless, which otherwise
  // present identically as root_grid_id == "". Empty when Info succeeded,
  // whether or not it declared a root.
  string info_error = 10;
  reserved 11; // instance_grid_id
  // glyph mirrors InfoResponse.glyph for the client's plugin glyphs: the
  // menu swatch and the drag ghost. "" is the generic globe.
  string glyph = 12;
  // plugin_grids mirrors InfoResponse.plugin_grids with grid targets
  // qualified for the receiver: they join the plugin's row in the (+) menu.
  repeated PluginGrid plugin_grids = 13;
  // connection marks the row a connection, the one row the client tells
  // from a plugin's (rpc.IsConnectionRow): rootless, it is waiting, not
  // nothing.
  bool connection = 14;
  // presents mirrors InfoResponse.presents, for the client's route verdict.
  repeated string presents = 15;
}
// ConnectionInfo is RETIRED (2026-09-18): a connection is a plugins row with
// connection set, rpc.ConnectionRow's shape, because the + menu is one
// uniform set of rows and this message was a second spelling of one member
// of it. The message and field 13 are kept forever and read in one place,
// rpc.TransitQualifyPluginList, so a node built before the fold keeps
// presenting its connections; nothing writes them.
message ConnectionInfo {
  string uuid          = 1;
  string label         = 2;
  string root_grid_id  = 3;   // the remote's home, qualified; "" while pending
  double root_view_cx   = 4;  // the remote home's persisted view (absent = unknown)
  double root_view_cy   = 5;
  double root_view_zoom = 6;
  string status_detail = 7;   // the last dial/learn failure while pending
}
message HandshakeResponse {
  reserved 2, 3, 6, 7, 8;   // a node grid's identity and viewport
  reserved 10, 11, 12;      // the home row's root_view_*, once copied here
  // plugins: the node's home (first) and its content plugins.
  repeated PluginInfo plugins = 1;
  // home_grid_id is where a client lands ("/"): the home's root grid,
  // qualified. It is a field, never derived from row order; the row rooted
  // there carries the home's framing.
  string home_grid_id   = 9;
  // connections is RETIRED; see ConnectionInfo. A connection is a plugins
  // row with kind "connection", after the home and the content plugins.
  repeated ConnectionInfo connections = 13;
  // shells_disabled: this node refuses shell tiles outright, from server.yaml's
  // disable_shells. The client removes the shell primitive from the + menu,
  // and the server refuses CreateTile(kind=shell) and OpenShell before routing,
  // on any grid. Only a home holds shells: a plugin creates no tile at all (its
  // CreateTile is Unimplemented) and plugin.v1 entry kinds have no shell. It is
  // a node-level operator fact, so it rides the node handshake rather than any
  // per-plugin Info.
  bool shells_disabled = 4;
  // content_token gates the HTTP /content/ API, the ServeContent carrier.
  // Pages served there run sandboxed with an opaque origin, so neither their
  // subresource requests nor the desktop's native views carry the auth cookie.
  // The token rides in the path instead, as
  // /content/<content_token>/<tile-id>/<subpath>. It is derived from the server
  // password by sha256 under its own domain prefix, so it can never double as
  // the auth cookie; it is handed out only on this authenticated handshake and
  // checked against the current password as the cookie is. It is a node-level
  // fact of the local origin: content URLs are always built against the serving
  // node, and a connection is followed behind the web API, over the RPC.
  string content_token = 5;
  // build is the commit the node was built from (tracewire.BuildCommit), ""
  // for an unstamped build, for the client's log. Nothing depends on it: the
  // web API refuses a page of another build on every call (OtherBuild).
  string build = 14;
  // routes is server.yaml's, in order, for the link funnel's verdict
  // (rpc.Decide), which must be made before any tile exists. Node-local:
  // zeroed on forward.
  repeated Route routes = 15;
}

// Route is one rule of server.yaml's ordered routes: match is a glob over the
// whole address, and exactly one of plugin (a plugin's id) and outside is
// set (rpc.CheckRoute). Its yaml keys are its field names.
message Route {
  string match   = 1;
  string plugin  = 2;
  bool   outside = 3;
}


// TileResponse is the shape returned by every tile-producing mutation.
message TileResponse {
  Tile tile = 1;
}

// DeadLink is the detail on a NotFound that means the path an id names
// ends in nothing: a namespace the answering node does not declare, at
// whatever hop that node sits, or a key its declared namespace says is gone.
// The link is dead, a state and not an error. gwerr.DeadLink writes it and
// gwerr.IsDeadLink reads it; namespace is the undeclared segment in the
// answering node's frame, empty when the namespace answered for a gone key.
message DeadLink {
  string namespace = 1;
}

// OtherBuild is the detail on the FailedPrecondition the web API answers a
// page of another build with, before the verb runs: node is the API's build,
// client the one the page named ("" when it named none). gwerr.OtherBuild
// writes it and gwerr.OtherBuildOf reads it; the client's one answer is to
// reload (client/nodebuild).
message OtherBuild {
  string node   = 1;
  string client = 2;
}

// SourceDisabled is the detail on the FailedPrecondition a node answers a write
// with when the source that owns its target is one the user disabled: the
// write cannot land before the node restarts, so the client drops it rather
// than parking it for a retry. Not Unavailable: the hop that relays it
// reached its far end, which is not dark. namespace is the disabled source in
// the answering node's frame. gwerr.SourceDisabled writes it and
// gwerr.IsSourceDisabled reads it.
message SourceDisabled {
  string namespace = 1;
}

// Answered is the detail the connection API stamps on every error it returns:
// the far node spoke, whatever the code. gwerr.Answered writes it and
// gwerr.Received reads it, at the dial.
message Answered {}

// CreateTileRequest creates one tile of any kind. There is no version: the
// tile does not exist yet. tile.kind selects which fields are meaningful:
//   door  → child_grid_id set makes a door to another namespace pointing at a grid in
//           another plugin, a qualified "<uuid>/<grid-id>"; empty allocates
//           a fresh interior child grid. alt_text is the door's label.
//   text  → content is the body.
//   pane  → content is the layout; empty is never arranged.
//   url   → url_string.
//   shell → no extra fields.
// A plugin that does not accept creates leaves this unimplemented.
message CreateTileRequest {
  reserved 1; // path
  string grid_id = 2;
  Tile   tile    = 3;
  reserved 4; // data
  // content is the bytes a text or workspace tile is born with, stored with the
  // row in one write, so no reader sees the tile without them. Refused on
  // every other kind.
  bytes  content = 5;
}

// ShellTmuxAlive reports whether the tile's Gridwell-private tmux
// currently exists. Called on shell descent so the client can
// decide whether to show the refresh button:
//   - alive=true             → button shown; refresh attaches.
//   - alive=false, no snap   → button shown; refresh creates fresh.
//   - alive=false, snap set  → button hidden; the JPEG is all that
//     remains (the tmux died, can't bring it back).
message ShellTmuxAliveRequest {
  string tile_id = 1;
}
message ShellTmuxAliveResponse {
  bool alive = 1;
}

// Mutations. A write of something the user made or placed claims what it was
// read at, one claim per fact: WriteContent and SetTile's rename claim the
// version (a row with no version, its stamp), MoveTile the placement,
// url_frozen the freeze, DeleteTile the version and placement. A stale claim
// is the version conflict, and the APIs refuse a missing one. Framing and
// capture writes carry no claim.

message CopyTileRequest {
  reserved 1, 5; // path, dest_path
  string tile_id = 2;
  reserved 3; // version
  string dest_grid_id = 4;
  int64 x = 6;
  int64 y = 7;
}

// SetTileRequest is the single framing and capture writeback, dispatched on
// tile.kind to the one operation that kind supports:
//   text  → text_x/text_y/text_mode                (framing)
//   url   → alt_text (page title), preview jpeg, url_history
//                                                 (automatic capture)
//   shell → preview jpeg                          (automatic capture)
// Door framing is not here: SetFraming is the one verb for both rows that
// can own it, door tile and root grid alike. A url's address is content
// and rides WriteContent; a SetTile carrying url_string is refused as
// InvalidArgument, so the address has one writer.
//
// Rename is the one user content edit this message carries, the one arm that
// bumps the version; it and url_frozen are the arms that claim. Empty preview,
// alt_text, and url_history fields are skipped so a partial capture never
// clobbers good state.
message SetTileRequest {
  reserved 1; // path
  string tile_id = 2;
  // version is the rename arm's claim, and only that arm's: a rename is the
  // user typing a name, the one user content edit this message carries.
  // Every other arm leaves it zero and the server ignores it.
  int64  version = 3;
  Tile   tile    = 4;   // the fields to write for tile.kind
  bytes  preview = 5;   // jpeg to freeze (url/shell)

  // The scalar writebacks. Exactly one operation per call: rename,
  // content_zoom, url_frozen, or the kind-dispatched tile writeback above.
  // A request setting more than one is refused, so the "empty fields are
  // skipped" rule never turns ambiguous.
  //
  // rename is the user's rename gesture: it sets alt_text and latches alt_user
  // so an automatic capture, such as a url page title or a shell foreground
  // command, defers from then on. tile.alt_text in the url arm is that
  // automatic capture. The two facts share one column and store.SetTileAlt is
  // the one place the alt_user latch arbitrates them. Versioned like every
  // user edit. Refused for text tiles, whose name derives from the first line.
  string rename = 6;
  // content_zoom is the per-tile content scale. Framing: no claim, and it never
  // bumps version. Refused for doors, and outside the range rpc.NewContentZoom
  // declares. optional so presence is explicit: an absent zoom is no write.
  optional double content_zoom = 7;
  // url_frozen is the user's standing freeze on a url or shell tile. It never
  // bumps version; it claims the value the writer saw (claim_frozen), and a
  // tile whose freeze moved meanwhile is refused with the version conflict.
  // Refused for a kind that cannot go live. optional so clearing (false) is
  // distinct from absent.
  optional bool url_frozen = 8;
  reserved 9; // adopt_child_grid
  // claim_frozen is url_frozen's claim; the APIs refuse url_frozen without
  // it, so absent is only the node's own write.
  optional bool claim_frozen = 10;
}

// DeleteTileRequest claims what the writer saw: the content version and the
// placement. A tile whose content or place moved meanwhile is refused with the
// version conflict and stands. The APIs refuse a request with no claim; only
// the node's own writers (a reap) reach a namespace without one.
message DeleteTileRequest {
  reserved 1; // path
  string tile_id = 2;
  reserved 3; // version
  int64 claim_version = 4;
  Placement claim = 5;
}
// DeleteTileResponse answers a delete that landed. tmux_left is why a shell's
// tmux the destroy should have ended is still running, the row's own or an
// ephemeral's its workspace tile's layout owned; empty when none was left. The next
// start's orphan sweep is its net.
message DeleteTileResponse {
  string tmux_left = 1;
}

// SetFramingRequest is the one framing verb: how a grid looked when the user
// left it through a given door. cx and cy are a float center in the grid's
// own coordinates; zoom is the pane-size-independent intrinsic ratio (live over
// overtake), so a window resize never moves a saved view. A center that is not
// a point or a zoom that is not a finite size above zero is refused as
// InvalidArgument with the reason (rpc.FramingOf); never visited is no write.
//
// Exactly one target is set, and that target also routes the call to the owning
// plugin. tile_id names the door tile a grid was entered through, onto its
// own grid, into another namespace or as a link, each door keeping its own
// framing; root_grid_id names a root grid, which has no door to carry it.
//
// Framing carries no version claim and makes no version bump; it is
// last-writer-wins, and the node keeps a plugin row's as it keeps home's.
message SetFramingRequest {
  string tile_id      = 1;  // qualified "<plugin-uuid>/<id>"; the door
  string root_grid_id = 2;  // qualified "<plugin-uuid>/<id>"; a root grid
  reserved 3; // version
  double cx           = 4;
  double cy           = 5;
  double zoom         = 6;
}
// SetFramingResponse carries the updated door tile, so the client can
// reconcile its row. A root write has no tile and leaves it unset.
message SetFramingResponse {
  Tile tile = 1;
}

// SetSelectionRequest changes grid_id's selection: clear empties it, then add
// puts tiles in, then remove takes tiles out, so a tile in both ends out. It
// carries no claim: two selects of different tiles merge in whichever order
// they land, and two of the same tile are the last one's. An added tile not on
// the grid is ignored. recurse, only with clear, also empties every grid
// nested under the grid's doors, to any depth, within the grid's namespace, in
// one write; recurse without clear is refused. all, only with clear and no
// grid, add, remove or recurse, empties every grid's set the node holds: home
// and each plugin namespace, and, asked at the web API, each live
// connection's far node, whose sets are its rows (rpc.SelectRefusal). A
// selection is not content: no version moves, the grid's or any tile's.
message SetSelectionRequest {
  string          grid_id = 1;
  reserved 2, 3; // claim (SelectionClaim), tile_ids: the whole-set form
  repeated string add     = 4;
  repeated string remove  = 5;
  bool            clear   = 6;
  bool            recurse = 7;
  bool            all     = 8;
}
// SetSelectionResponse is empty: the set on disk reaches every view, the
// writer's included, as SelectionChanged.
message SetSelectionResponse {}

// Event stream.

// SubscribeRequest's session names the client holding the stream, a string
// the client mints once (rpc.Client). What SetView says under that session
// counts while a stream carrying it is open, and no longer, so a client that
// goes away cannot keep a source watched. Empty names no session.
message SubscribeRequest {
  string session = 1;
}

// SetView is the whole of what one session shows, sent whenever any of it
// changes and again whenever the session's stream re-opens. It is unary
// rather than a Subscribe field because the view changes many times in one
// stream's life. The node holds the latest per session in memory while a
// stream carrying the session is open and for subscription.AwayFor after its
// last one closes, listed away; it never stores one.
//
// shown_grid_ids is derived on the client, because the layout rects that say
// what is on screen are session-ephemeral client facts: each laid-out pane's
// grid and the child grid of every door whose preview is on screen,
// qualified, sorted, each once (pane.Showing). The node unions every open
// session's shown_grid_ids, and each namespace's share of the union, sent to
// it as a SetView with only shown_grid_ids and no session, is the scope of
// its Watch.
message SetViewRequest {
  string          session        = 1;
  repeated string shown_grid_ids = 2;
  // label names the kind of client: "desktop", "browser", or "node" for
  // another node telling its share through a connection.
  string          label          = 3;
  repeated ViewPane panes        = 4;
  // workspace_tiles is the window's workspace level, the workspace tiles it is inside,
  // outermost first; empty outside every workspace tile. panes are the tree of the
  // innermost.
  repeated string workspace_tiles     = 5;
}
message SetViewResponse {}

// ViewPane is one pane of a session's view: its place as the URL grammar
// names it (pane.URLState), qualified, and whether it has focus.
message ViewPane {
  string          id         = 1;
  // anchor is the grid the place's last namespace level is rooted at, and
  // path the door tiles from it down to the pane's grid.
  string          anchor     = 2;
  repeated string path       = 3;
  // content_id is the content tile the pane is inside, "" on a grid.
  string          content_id = 4;
  // grid_id is the grid the pane is at, or that its content tile sits in,
  // derived on the client as shown_grid_ids is; "" while it is not cached.
  string          grid_id    = 5;
  bool            focused    = 6;
  reserved 7; // layout_pane_id
}

// DisableSource switches off a plugin or connection this node declares,
// named as its health event names it, until the node restarts. It is held in
// memory only: server.yaml and gridwell.db are untouched, and the source reads
// as dark meanwhile.
message DisableSourceRequest {
  string namespace = 1;
}
message DisableSourceResponse {}

// GridChanged says a grid's listing changed: the client refetches it.
message GridChanged {
  string grid_id = 1;
}

// GridFramingChanged carries a root grid's new framing, the three numbers
// SetFraming wrote to its row, in PluginGrid's field names. It is apart from
// GridChanged because a framing write changes no listing: the client applies
// it to the doors rooted at grid_id and fetches nothing. A door's framing
// lives on its tile and rides TileChanged.
message GridFramingChanged {
  string grid_id   = 1;
  double view_cx   = 2;
  double view_cy   = 3;
  double view_zoom = 4;
}

// SelectionChanged carries a grid's whole new selection, so no view reads
// the grid again to learn it.
message SelectionChanged {
  string          grid_id  = 1;
  repeated string tile_ids = 2;
}

message TileChanged {
  Tile tile = 1;
  // content_changed: the bytes behind this row changed though nothing on the
  // row says so. A row with no claim (a plugin's: version 0, no blob) has no
  // fact that orders its bytes, so the event is the change, and a client drops
  // a clean body it holds for the row. Set only by the node that learned it
  // from its source; a framing or capture write on the same row leaves it
  // unset, and a versioned row never needs it.
  bool content_changed = 2;
}

message TileRemoved {
  string grid_id = 1;
  string tile_id = 2;
}

// EventPluginHealth reports a transition in a plugin's event-stream health, as
// the router's fan-in sees it (watchPlugin in internal/server/router.go,
// over namespace.Refollow). It is emitted on the down transition, with
// healthy=false and detail carrying the dial, recv or Info error that caused
// it, and again on recovery with healthy=true and detail="". Only on a change
// of state, so a flapping plugin does not spam the client.
message EventPluginHealth {
  string plugin_uuid = 1;
  bool healthy       = 2;
  string detail       = 3;
  // Why the source cannot tell the node of its changes, empty while it can.
  // It is not health: the listings still answer live, so it rides a healthy
  // event too, and a change of it alone is a transition.
  string live_updates_off = 4;
  // The user switched this source off until the node restarts
  // (DisableSource): healthy is false and nothing will try it again.
  bool disabled = 5;
}

// Event carries one of the change kinds. The variant tag is the discriminator.
message Event {
  oneof payload {
    GridChanged grid_changed = 1;
    TileChanged tile_changed = 2;
    TileRemoved tile_removed = 3;
    EventPluginHealth plugin_health = 4;
    GridFramingChanged grid_framing_changed = 5;
    SelectionChanged selection_changed = 6;
  }
}

// Gridwell is the one RPC surface a node serves: the web, connection and MCP
// APIs decode onto it, and pluginhost adapts plugin.v1 to it.
service Gridwell {
  // ── Lifecycle ───────────────────────────────────────────────────────────
  // Info is the whole handshake: identity plus the default root. Handshake
  // enumerates a node's plugins; the transport calls it on a remote to learn
  // that node's namespaces.
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // ── Shell (live PTY, both ways) ───────────────────────────────────────────
  rpc OpenShell(stream OpenShellRequest) returns (stream OpenShellResponse);

  // ── Reads ─────────────────────────────────────────────────────────────────
  rpc GetGrid(GetGridRequest)               returns (GetGridResponse);
  rpc GetTile(GetTileRequest)               returns (TileResponse);
  rpc GetTilePreview(GetTilePreviewRequest) returns (GetTilePreviewResponse);
  rpc Find(FindRequest)                 returns (FindResponse);

  // ── Content streams (the one way content bytes move; see the messages) ────
  rpc ReadContent(ReadContentRequest)        returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (TileResponse);

  // ── Web content (the HTTP /content/ API's RPC carrier) ──────────────────
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);

  // MoveTile is the single placement writeback.
  rpc MoveTile(MoveTileRequest) returns (TileResponse);

  // ── Mutations (one create, one writeback, plus placement) ─────────────────
  rpc CreateTile(CreateTileRequest) returns (TileResponse);
  rpc SetTile(SetTileRequest)       returns (TileResponse);
  rpc CopyTile(CopyTileRequest)   returns (TileResponse);
  rpc DeleteTile(DeleteTileRequest) returns (DeleteTileResponse);

  // SetFraming persists the framing of a grid: onto the door tile it was
  // entered through, or onto the grid row itself for a root that has no
  // door. One verb, one shape, both rows.
  rpc SetFraming(SetFramingRequest) returns (SetFramingResponse);

  // SetSelection clears, adds to and takes from a grid's selection.
  rpc SetSelection(SetSelectionRequest) returns (SetSelectionResponse);

  // ShellTmuxAlive gates the client's refresh button on shell descent.
  rpc ShellTmuxAlive(ShellTmuxAliveRequest) returns (ShellTmuxAliveResponse);

  rpc Subscribe(SubscribeRequest) returns (stream Event);

  rpc SetView(SetViewRequest) returns (SetViewResponse);
  rpc DisableSource(DisableSourceRequest) returns (DisableSourceResponse);
}
