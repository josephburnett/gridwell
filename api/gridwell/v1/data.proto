// data.proto is the single source of truth for Gridwell's wire types and
// the persisted record shapes. Every stored field in Grid and Tile maps 1:1
// to a column described by internal/local/store/columns.go;
// TestDescriptorMatchesProto pins the two together in both directions.
//
// Conventions:
//   - kind, source_kind, and text_mode are string fields, not enums. The
//     DDL CHECK constraints already pin the closed sets; strings keep the
//     proto-to-column mapping mechanical and let named constants live
//     alongside the generated types.
//   - created_at and updated_at exist in the DDL but are not on the wire.
//     They are pure storage metadata.
syntax = "proto3";

package gridwell.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/gridwell/v1;gridwellv1";

// Every mutation is id-addressed; the server derives location facts itself.
// No request carries a descent path.

// Grid is the persistent unit of canvas. Tiles live in grids; wells
// point at child grids. The root grid has no parent.
//
// source_kind is empty for a regular Gridwell-owned grid, "fs" for a
// grid whose tile list is reconciled against a host directory, "proc"
// for the process table. source_id carries the path or PID.
message Grid {
  string id = 1;
  // 2 was object_id, a provenance mint no reader consulted. Identity is
  // the id.
  reserved 2;
  int64 version = 3;
  string source_kind = 4;
  string source_id = 5;
  // writable reports whether the grid's owning plugin accepts mutations.
  // It is per grid, not per namespace, because one connection fronts many
  // remote plugins with differing capabilities. Stamped by the serving node
  // from the owning plugin's Info at a leaf, passed through verbatim in
  // transit. Wire-only, never persisted.
  bool writable = 6;
  // scratch_grid_id is the owning plugin's ephemeral-url scratch grid,
  // qualified from the receiver's perspective and chained through mounts,
  // by the same stamping rule as writable. "" when the plugin has none.
  // Wire-only.
  string scratch_grid_id = 7;
  // 8 was proxy_endpoint, removed with the network-context surface: live
  // url tiles always browse from the host's own network.
  reserved 8;
  // 9 was create_schemas, a creation-parameter form no plugin declared and
  // no client read.
  reserved 9;
  // stale marks a grid the source could not answer for: this is the
  // remembered answer, not the live one. Two node-side stampers share the
  // one meaning — internal/sourcecache on its serve-stale path, and a
  // plugin adapter answering a dark source from the rows it minted.
  // Wire-only, never persisted. The cache also obeys it: an answer already
  // stamped stale is never remembered.
  bool stale = 12;
  // node_ns is the namespace chain of the node serving this grid, from the
  // receiver's perspective: "" for a grid served by the node you are
  // talking to, "<transit>/<conn>" or deeper through mounts, each transit
  // hop prepending its segment exactly like scratch_grid_id. It is the one
  // owner of "which node is this pane inside": the client keys its per-pane
  // + menu context by it and routes Handshake with it. Wire-only, never
  // persisted.
  string node_ns = 10;
  // menu_entries is the owning plugin's declared (+) menu additions for
  // this grid. Stamped from Info by the serving node, and verbatim through
  // transit with grid_id prefixed per hop. Wire-only.
  repeated MenuEntry menu_entries = 11;
  // host_content says this grid PROJECTS host state — a directory, the
  // process table — instead of holding content of its own: read-only rows
  // the client renders with the host treatment (the outside tint, the exit
  // border family). Declared by the owning plugin (plugin.v1
  // InfoResponse.host_content), stamped onto the grid by the adapter that
  // serves it, and carried verbatim through transit like writable. It is
  // what a reader consults instead of learning a kind's name.
  // Wire-only, never persisted.
  bool host_content = 13;
  // glyph is the owning plugin's declared identity glyph for this grid, from
  // the same vocabulary as InfoResponse.glyph ("" = no declaration, and the
  // client falls back to the well face or the mount door's glyph). It
  // travels on the GRID because a plugin-list lookup cannot answer for a
  // grid reached through a mount. Stamped by the adapter, verbatim in
  // transit. Wire-only, never persisted.
  string glyph = 14;
}

// MenuEntry is one plugin-declared (+) menu entry: an extra plugin root,
// such as the trashcan. Declared in Info, stamped per grid by the serving
// node exactly like writable, and passed verbatim through transit hops,
// where grid_id gains the hop prefix like every id. The swatch behaves like
// a plugin swatch over grid_id: click descends, drag drops an exit-well
// link.
//
// 5 and 6 were kind and param_schema, the creation-entry half. No client
// could ever receive one.
message MenuEntry {
  string id           = 1; // entry identity within the plugin
  string label        = 2; // swatch label, verbatim
  string glyph        = 3; // the declared glyph vocabulary ("" = the kind's default face)
  string color        = 4; // optional CSS accent for the swatch border/glyph ("" = default)
  reserved 5, 6;
  string grid_id      = 7; // the target grid, qualified per hop
}

// Tile is the persistent unit of content in a grid. kind selects which
// subset of the optional fields is meaningful; the DDL CHECK constraint
// enforces it.
message Tile {
  string id = 1;
  reserved 2; // object_id; see Grid's reserved 2

  int64 version = 3;
  string grid_id = 4;
  string kind = 5;
  int64 x = 6;
  int64 y = 7;
  int64 w = 8;
  int64 h = 9;

  // 10 and 11 were view_x and view_y, an integer window origin. The center
  // is stored directly now.
  reserved 10, 11;

  // well-only: the child grid's framing, which is at once the preview
  // frame, the descent target, and the ascent return value. One shape: a
  // float center in the child grid's coordinates (view_cx, view_cy) plus
  // the pane-size-independent intrinsic zoom (live over overtake), the same
  // three numbers a root grid keeps on its own row. view_zoom == 0 means
  // never visited.
  double view_zoom = 12;
  double view_cx = 36;
  double view_cy = 37;
  string child_grid_id = 13;

  // text-only: text_x/text_y is the scroll offset; text_w/text_h is the
  // window size; all four are doc-space px. text_mode is "rendered" or
  // "text". blob_id points at the markdown source in the blobs table.
  int64 text_x = 14;
  int64 text_y = 15;
  int64 text_w = 16;
  int64 text_h = 17;
  string text_mode = 18;
  int64 blob_id = 19;

  // url-only: the http(s) URL plus a pointer at the last-frozen JPEG
  // preview (in the blobs table; hash-deduped across clones).
  string url_string = 20;
  int64 preview_blob_id = 21;

  // 22, 23, 24 were fs_path, pid, and source_key. A file or process well
  // is a plain well whose child_grid_id is a qualified
  // "<plugin-uuid>/<grid-id>" reference.

  // alt_text is the canonical display label, rendered verbatim by the
  // client. Stamped at insert time (for plugin-owned tiles, the entry name;
  // for an exit well, the mounted plugin's label).
  string alt_text = 25;

  // reference reports that this well is a link, not owned content: its
  // child_grid_id is a qualified cross-plugin reference rather than a bare
  // local child grid. It is the single authoritative "is a link" signal.
  // The client renders a dashed border from it, and delete and clone treat
  // a qualified child_grid_id as unlink-only and share, never cascade. Set
  // by the server in qualifyTiles, from a child that arrived already
  // qualified, so render and the store cannot disagree on what a link is.
  // Wire-only, derived, never a stored column.
  bool reference = 26;

  // content_zoom scales the content rendered inside a text, shell, or url
  // tile: the text font, the terminal font, the page zoom. It is framing,
  // not content — persisted per tile, and it never bumps version. 0 means
  // unset and renders at 1.0. Written by the SetTile content_zoom arm
  // only.
  double content_zoom = 27;

  // url_history is a url tile's persisted navigation back-stack, JSON
  // {index, entries:[{url,title}]} and capped, captured at freeze so a
  // revived tile can still go back. Rides the url SetTile writeback. An
  // empty value on a write leaves the stored history untouched, so a
  // partial capture cannot clobber it, mirroring the preview-JPEG rule.
  string url_history = 28;

  // link_target_id makes a leaf tile (text, url, shell, pane) a link: a
  // qualified "<plugin-uuid>/<tile-id>" reference to the tile that owns the
  // content. The link row stores no content of its own — no blob, no url,
  // no preview — and readers resolve bytes, preview, and session through
  // the target id, which the router routes anywhere, including through
  // transit chains that prepend one hop segment exactly as they do for a
  // well's qualified child_grid_id. Kind stays the target's kind;
  // link-ness is orthogonal metadata. A well's link variant is a qualified
  // child_grid_id instead, and reference is the single derived "is a link"
  // bit over both shapes. Deleting a link only unlinks.
  string link_target_id = 29;

  // url_frozen is the user's standing freeze on a url tile: set by the
  // explicit freeze gesture, cleared by the reconnect button. While set,
  // descending does not auto-go-live, unlike the transient navigate-away
  // freeze, which auto-revives on return. Framing-class: written by the
  // SetTile url_frozen arm only, and it never bumps version.
  bool url_frozen = 30;

  // 31 was configure_plugin_id, which marked a childless well as an
  // unconfigured plugin well. Nothing can mint a childless well now.
  reserved 31;

  // serves_page: the owning plugin serves this tile's content as web
  // content through the /content/ door, over the ServeContent RPC — an
  // image file, an HTML page. The client gives the descent url-tile
  // semantics (a live native view on a desktop host, open-in-new-tab on a
  // browser host) at the derived address
  // /content/<content-token>/<tile-id>/, built at render time from the
  // current origin and never persisted, because ports are ephemeral.
  // Plugin-declared, derived from the content itself, such as the
  // filename's media type in fs. Never a stored column.
  bool serves_page = 32;

  // text_presentation is the owning plugin's declaration of how a text
  // tile's body presents: "plain" (monospace, no markdown interpretation —
  // source code, logs), "rendered" (document renderer only), or "both"
  // (rendered by default, and the user may toggle to the raw source). ""
  // means no declaration, and the stored user text_mode rules, which is the
  // case for the home's own documents. Plugin-derived from the content
  // itself, such as the filename or a sniff in fs. Wire-only, never a
  // stored column.
  string text_presentation = 33;

  // 34 was menu_entry, the creation-entry half of MenuEntry. Nothing
  // minted an entry tile and no plugin persisted the field.
  reserved 34;

  // status_detail is the owning plugin's current trouble with this tile,
  // for the client to display verbatim. A connection well whose last dial
  // failed carries that error until the connection comes up, so the failure
  // surfaces instead of presenting as a tile that is merely waiting.
  // Wire-only, derived. Never a stored column, never set by clients.
  string status_detail = 35;
}

// ─── Plugin / node lifecycle ──────────────────────────────────────────────
// The same RPCs are exposed by a node, a plugin process, and a remote node
// reached over a connection. The client talks to its own node; the node
// routes to plugins and forwards through connections.

// Info is the whole plugin handshake: a plugin loaded from server.yaml is
// simply there, so Info reports its identity and its default root grid.
// There is no Attach or Detach — the gRPC connection, opened at load and
// closed at unload, is the only lifecycle.
message InfoRequest {}
message InfoResponse {
  string kind           = 1;   // e.g. "home", "fs", "proc"
  string display_name   = 2;
  int64  schema_version = 3;
  bool   watch          = 4;   // implements Subscribe for live change events
  // root_grid_id is the plugin's default root: fs uses its configured
  // root, proc pid 1, the home its singleton root. Click-enter descends
  // here.
  string root_grid_id   = 5;
  reserved 6; // network (NetworkContext); live tiles always use the host network
  reserved 7; // has_session; the Chromium session is host-local
  // 13 was create_schemas; see Grid's reserved 9.
  reserved 13;
  // scratch_grid_id is the plugin's off-grid grid for ephemeral url tiles,
  // where descending into a url places no tile. Never rendered, never
  // mounted; it persists as visited-url history. Empty for plugins that do
  // not support ephemeral visits, such as fs and proc.
  string scratch_grid_id = 8;
  // writable reports that this plugin accepts CreateTile, so new primitives
  // can be dropped into its grids. Like watch, it is a capability the
  // plugin declares once here; the node must never re-derive it from the
  // kind string, or a remote plugin reached through a connection is wrongly
  // presented read-only.
  bool writable = 9;
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport: the
  // center in grid coordinates and the intrinsic zoom. The home fills it
  // from its system KV table; fs and proc return zero, having no persistent
  // root view. The client seeds the doorway framing from it so re-entry
  // restores the left-off view. Purely a read; the write path is
  // SetFraming.
  double root_view_cx   = 10;
  double root_view_cy   = 11;
  double root_view_zoom = 12;
  // 14 was instance_grid_id, the parameterized-plugin instance grid.
  // Connections list as HandshakeResponse.connections instead.
  reserved 14;
  // 15 was transit, a plugin declaring that its ids are chains from another
  // node. The node's own transport is the only transit namespace there is,
  // and it is structural — a connection's ids arrive already qualified from
  // the far node's frame — not a declaration anyone makes.
  reserved 15;
  // glyph is the plugin's identity glyph for the menu and ghost faces:
  // "folder", "process", "well", or "" for the generic globe. It is a
  // declaration, never a kind switch in the client, and unknown values also
  // fall back to the globe, so a third-party plugin degrades politely.
  string glyph = 16;
  // menu_entries is the plugin's declared (+) menu additions; see
  // MenuEntry. The serving node stamps them onto every grid the plugin
  // serves.
  repeated MenuEntry menu_entries = 17;
}

// Probe reports the definitive presence of one tile. It is for
// non-authoritative sources, such as proc, where an entry can vanish
// between a listing and the reconcile. A failed read must never sweep a
// tile; only GONE does.
message ProbeRequest {
  string tile_id = 1;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// ─── Shell streaming ──────────────────────────────────────────────────────
// OpenShell is bidirectional: raw PTY bytes both ways. The first
// OpenShellRequest binds the tile, with data empty; then keystrokes flow up
// and terminal output flows down.

message OpenShellRequest  { string tile_id = 1; bytes data = 2; PTYSize resize = 3; }
message OpenShellResponse { bytes data = 1; }
message PTYSize           { int32 cols = 1; int32 rows = 2; }

// Reads.

message GetGridRequest {
  string grid_id = 1;
}
message GetGridResponse {
  Grid grid = 1;
  repeated Tile tiles = 2;
}

message GetTilePreviewRequest {
  string tile_id = 1;
}
message GetTilePreviewResponse {
  bytes jpeg = 1;
}

// ─── Content streams ──────────────────────────────────────────────────────
// ReadContent and WriteContent are the one way content bytes move: values,
// finite and versioned and transactional, as opposed to OpenShell's live
// wire. Creation is metadata-only; a body follows as a write.

// ReadContent streams a tile's content bytes. Chunk 1 carries media_type and
// the tile row version the bytes belong to — the client's save basis, so
// bytes and version are paired at the owner, never apart. Later chunks carry
// data only. On a leaf-link tile the serving node resolves through
// link_target_id, the one resolution point, so callers never reimplement
// link semantics. Plugins whose bodies are not version-edited, such as fs
// and proc, send version 0.
message ReadContentRequest {
  string tile_id = 1;
}
message ContentChunk {
  bytes data = 1;
  string media_type = 2; // chunk 1 only
  int64 version = 3;     // chunk 1 only
}

// WriteContent streams a tile's content bytes up. The first message binds
// tile_id and claims the version, checked against the row before any byte is
// accepted; subsequent messages carry data only. The write commits at close:
// the new value becomes visible only when the stream closes cleanly, and a
// broken stream leaves the old value byte-for-byte intact. Version semantics
// are kind-determined in the store's one table — a text body is a content
// edit that claims and bumps; a pane layout is framing-class, with no claim
// and no bump. Not accepted on link tiles: content operations write through
// the target the caller names explicitly.
message WriteContentRequest {
  string tile_id = 1;
  int64 version = 2;
  bytes data = 3;
}

// ServeContent is the plugin-as-web-server door: the RPC carrier behind
// the server's HTTP /content/ endpoint. A GET of
// /content/<token>/<tile-id>/<subpath> becomes one ServeContent call routed
// to the tile's owning plugin — through transit hops exactly like
// ReadContent — and the response streams back as the HTTP body. It exists so
// a plugin can present ANY content as web content (an image file, a whole
// HTML page with its relative subresources); the browser side is sandboxed
// by the server (CSP sandbox — opaque origin, no cookies, no RPC reach), so
// a plugin-served page can never act on the user's Gridwell.
//
// GET-only by design. subpath "" is the tile's root page; a non-empty
// subpath is a page-relative resource ("img/cat.png") whose meaning the
// plugin defines. Chunk 1 carries status and media_type; later chunks carry
// data only. A plugin that does not serve web content leaves the RPC
// unimplemented and the door answers 404.
message ServeContentRequest {
  string tile_id = 1;
  string subpath = 2;
}
message ServeContentChunk {
  int64 status = 1;      // chunk 1 only; HTTP status code
  string media_type = 2; // chunk 1 only
  bytes data = 3;
}

// PlaceTile is the single placement writeback: placement is one fact,
// (grid_id, x, y, w, h), and one verb owns it. grid_id is the destination
// grid, the same as the tile's current grid for a pure resize. The server
// refuses overlap, and refuses placing a well inside its own subtree by
// walking ancestors from grid_id — a server-derived check, with no
// client-supplied path. Placement never crosses a plugin boundary; there is
// no cross-plugin move, only link or clone.
message PlaceTileRequest {
  string tile_id = 1;
  reserved 2; // version: placement is layout, not content, so it carries no
              // claim. Overlap is still refused server-side, in the same
              // transaction.
  string grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
}

// GetTile reads a single tile's metadata. The server's preview + shell
// infrastructure uses it to check a tile's kind without enumerating a grid.
message GetTileRequest {
  string tile_id = 1;
}

// Search is the one generic find verb. Every plugin may implement it;
// Unimplemented simply means no results. The query is free text with a small
// selector grammar owned by one shared parser (rpc.ParseSearchQuery):
// id:<tile-id> is an exact-id lookup, and anything else is
// plugin-interpreted text matching against names, bodies, addresses, or
// whatever the plugin's data means. Each result is a place, not just a row:
// the tile plus its containing-well chain from the plugin's root grid,
// outermost first and empty at the root, so a hit can be navigated to and
// its crumbs previewed. snippet and score are optional context and ranking
// for merged displays.
//
// Routing, on the server surface: scope routes to one namespace, and the
// plugin that owns that qualified id answers; an empty scope fans out to
// every configured plugin in config order. A transit hop forwards the query
// to the remote node, which fans out again, so an unscoped search recurses
// through the whole federation and results come back qualified like every
// other id.
message SearchRequest {
  string query = 1;
  // limit caps the results per answering plugin; 0 means the plugin's
  // default.
  int32 limit = 2;
  // scope: server surface only (plugins receive their own namespace's
  // queries with scope already consumed).
  string scope = 3;
}
message SearchResult {
  Tile tile = 1;
  repeated Tile path = 2;
  string snippet = 3;
  double score = 4;
}
message SearchResponse {
  repeated SearchResult results = 1;
}

// Handshake enumerates the plugins a node hosts, in config order. The client
// builds the + menu from it. A leaf plugin returns an empty list.
message HandshakeRequest {
  // namespace routes the request. "" answers for this node, which is the
  // boot handshake; a namespace chain ("<transit>" or "<transit>/<conn>/…")
  // peels one segment per hop and forwards to the node it names, so the +
  // menu inside a remote pane shows that node's plugins exactly as a direct
  // client would see them. Each hop re-qualifies the response's grid ids
  // with its prefix, like every other transit response, and node-local
  // fields (content token, node identity and view) are zeroed on forward:
  // they answer only for the node you asked directly.
  string namespace = 1;
}
message PluginInfo {
  string uuid          = 1;   // the plugin's namespace; child grids are <uuid>/<id>
  string kind          = 2;   // "home", "fs", "proc", "connection"
  string label         = 3;   // display name
  bool   writable      = 4;   // accepts new tiles (primitives can be created in it)
  string root_grid_id  = 5;   // qualified <uuid>/<id> of the plugin's default root
                              // grid; click-enter descends here
  string scratch_grid_id = 6; // qualified <uuid>/<id> of the plugin's off-grid
                              // scratch grid for ephemeral url tiles; "" if none
  // root_view_cx/cy/zoom is the plugin root grid's last-saved viewport,
  // forwarded verbatim from InfoResponse. Zero means never visited; the
  // client substitutes the default calibrated zoom on enterPlugin.
  double root_view_cx   = 7;
  double root_view_cy   = 8;
  double root_view_zoom = 9;
  // info_error is set when the plugin's Info handshake failed or timed out,
  // distinguishing broken from healthy but rootless, which otherwise
  // present identically as root_grid_id == "". Empty when Info succeeded,
  // whether or not it declared a root.
  string info_error = 10;
  // 11 was instance_grid_id, the parameterized-plugin instance grid.
  reserved 11;
  // glyph mirrors InfoResponse.glyph for the client's plugin faces: the
  // menu swatch and the drag ghost. "" is the generic globe.
  string glyph = 12;
  // menu_entries mirrors InfoResponse.menu_entries with grid targets
  // qualified for the receiver: root entries join the plugin's row in the
  // (+) menu.
  repeated MenuEntry menu_entries = 13;
}
// ConnectionInfo is one of the node's connections as the handshake lists
// it: a row in the + menu that descends into the remote node's home. uuid
// is "<node id>/<connection name>", the namespace every reference through
// the connection carries.
message ConnectionInfo {
  string uuid          = 1;
  string label         = 2;
  string root_grid_id  = 3;   // the remote's home, qualified; "" while pending
  double root_view_cx   = 4;  // the remote home's persisted view (zero = unknown)
  double root_view_cy   = 5;
  double root_view_zoom = 6;
  string status_detail = 7;   // the last dial/learn failure while pending
}
message HandshakeResponse {
  // 2, 3, and 6-8 were a node grid's identity and viewport. A node has no
  // grid of its own; home is where a client lands and where a mount lands.
  reserved 2, 3, 6, 7, 8;
  // plugins: the node's home (first) and its content plugins.
  repeated PluginInfo plugins = 1;
  // home_grid_id is where a client lands ("/"): the home's root grid,
  // qualified. It is a field, never derived from row order. home_view_* is
  // its persisted viewport, and zero zoom means never set.
  string home_grid_id   = 9;
  double home_view_cx   = 10;
  double home_view_cy   = 11;
  double home_view_zoom = 12;
  // connections: the node's remote nodes, in config order.
  repeated ConnectionInfo connections = 13;
  // shells_disabled: this node refuses shell tiles outright, from
  // server.yaml's disable_shells. The client removes the shell primitive
  // from the + palette, and the server refuses CreateTile(kind=shell) and
  // OpenShell no matter which plugin would serve them. It is a node-level
  // operator fact, so it rides the node handshake, not any per-plugin
  // Info.
  bool shells_disabled = 4;
  // content_token gates the HTTP /content/ door, the ServeContent carrier.
  // Pages served there run sandboxed with an opaque origin, so neither their
  // subresource requests nor the desktop's native views carry the auth
  // cookie; the token rides in the path instead, as
  // /content/<content_token>/<tile-id>/<subpath>. It is derived from the
  // server password by sha256 under its own domain prefix, so it can never
  // double as the auth cookie, handed out only on this authenticated
  // handshake, and checked against the current password like the cookie is.
  // It is a node-level fact of the local origin: content URLs are always
  // built against the serving node, and federation happens behind the door,
  // over the RPC.
  string content_token = 5;
}


// TileResponse is the shape returned by every tile-producing mutation.
message TileResponse {
  Tile tile = 1;
}

// CreateTileRequest creates one tile of any kind. There is no version: the
// tile does not exist yet. tile.kind selects which fields are meaningful:
//   well  → child_grid_id set makes an exit well pointing at a grid in
//           another plugin, a qualified "<uuid>/<grid-id>"; empty allocates
//           a fresh interior child grid. alt_text is the well's label.
//   text  → the body follows as a WriteContent.
//   url   → url_string.
//   shell → no extra fields.
// A plugin that does not accept creates leaves this unimplemented.
message CreateTileRequest {
  reserved 1; // path; grid_id is authoritative
  string grid_id = 2;
  Tile   tile    = 3;
  reserved 4; // data; WriteContent is the one way to write bytes, and
              // creation is metadata-only
}

// ShellSessionAlive reports whether the tile's Gridwell-private tmux
// session currently exists. Called on shell descent so the client can
// decide whether to show the refresh button:
//   - alive=true             → button shown; refresh attaches.
//   - alive=false, no snap   → button shown; refresh creates fresh.
//   - alive=false, snap set  → button hidden; the JPEG is all that
//     remains (the session died, can't bring it back).
message ShellSessionAliveRequest {
  string tile_id = 1;
}
message ShellSessionAliveResponse {
  bool alive = 1;
}

// Mutations. A version claim rides only the writes that change the user's
// content bytes — WriteContent and SetTile's rename arm — and the server
// returns a version-conflict error when it does not match. Layout, framing,
// and capture writes carry no claim at all.

message CloneTileRequest {
  reserved 1, 5; // path, dest_path; the subtree copy completes before the
                 // insert, so no cycle can form and no client-supplied
                 // location is needed
  string tile_id = 2;
  reserved 3; // version; a clone leaves the source row untouched, and
              // layout carries no claim
  string dest_grid_id = 4;
  int64 x = 6;
  int64 y = 7;
}

// SetTileRequest is the single framing and capture writeback. It is
// dispatched on tile.kind to the one operation that kind supports:
//   text  → text_x/text_y/text_w/text_h/text_mode  (framing)
//   url   → url_string, alt_text (page title), preview jpeg, url_history
//                                                 (automatic capture)
//   shell → preview jpeg                          (automatic capture)
// Well framing is not here: SetFraming is the one verb for both rows that
// can own it, doorway tile and root grid alike.
//
// Nothing this message can write is a user content edit, so no arm bumps the
// version and no arm carries a claim, apart from rename. Empty preview,
// url_string, and alt_text fields are skipped so a partial capture never
// clobbers good state.
message SetTileRequest {
  reserved 1; // path; the request is id-addressed
  string tile_id = 2;
  // version is the rename arm's claim, and only that arm's: a rename is the
  // user typing a name, the one user content edit this message carries.
  // Every other arm leaves it zero and the server ignores it.
  int64  version = 3;
  Tile   tile    = 4;   // the fields to write for tile.kind
  bytes  preview = 5;   // jpeg to freeze (url/shell)

  // The scalar writebacks. Exactly one operation per call: rename,
  // content_zoom, url_frozen, or the kind-dispatched tile writeback above.
  // A request setting more than one is refused, so the "empty fields are
  // skipped" rule never turns ambiguous.
  //
  // rename is the user's rename gesture: it sets alt_text and latches
  // alt_user so automatic captures (url page title, shell foreground
  // command) defer from then on. It is distinct from tile.alt_text in the
  // url arm, which is the automatic title capture — two facts in one
  // column, arbitrated by the alt_user latch in exactly one place
  // (store.SetTileAlt). Versioned like every user edit. Refused for text
  // tiles, whose name derives from the first line.
  string rename = 6;
  // content_zoom is the per-tile content scale. Framing: no claim, and it
  // never bumps version. Refused for wells. optional so presence is
  // explicit, because 0 is a meaningful stored value.
  optional double content_zoom = 7;
  // url_frozen is the user's standing freeze on a url tile. Framing: no
  // claim, and it never bumps version. Refused for non-url tiles. optional
  // so clearing (false) is distinct from absent.
  optional bool url_frozen = 8;
  // 9 was adopt_child_grid, which adopted an unconfigured plugin well.
  // Nothing can mint a childless well now.
  reserved 9;
}

message DeleteTileRequest {
  reserved 1; // path; the request is id-addressed
  string tile_id = 2;
  reserved 3; // version; a delete is layout — the row moves to the trash and
              // is recoverable — so it must not be refused because a capture
              // bumped the row
}
message DeleteTileResponse {}

// SetFramingRequest persists "how this grid looked when I left it through
// this doorway": the one framing verb. cx and cy are a float center in the
// grid's own coordinates; zoom is the pane-size-independent intrinsic ratio
// (live over overtake), so a window resize never moves a saved view. Zoom 0
// means never visited.
//
// Exactly one target is set, and it is also what routes the call to the
// owning plugin: tile_id names the doorway tile a grid was entered through
// (a well, interior or exit or link — each doorway keeps its own framing),
// and root_grid_id names a root grid, which has no doorway to carry it.
//
// Framing carries no version claim and makes no version bump; it is
// last-writer-wins. A plugin that keeps no framing answers Unimplemented,
// which the node treats as nothing to store, not an error.
message SetFramingRequest {
  string tile_id      = 1;  // qualified "<plugin-uuid>/<id>"; the doorway
  string root_grid_id = 2;  // qualified "<plugin-uuid>/<id>"; a root grid
  reserved 3; // version; framing carries no claim
  double cx           = 4;
  double cy           = 5;
  double zoom         = 6;
}
// SetFramingResponse carries the updated doorway tile, so the client can
// reconcile its row. A root write has no tile and leaves it unset.
message SetFramingResponse {
  Tile tile = 1;
}

// Event stream.

message SubscribeRequest {}

message GridChanged {
  string grid_id = 1;
}

message TileChanged {
  Tile tile = 1;
}

message TileRemoved {
  string grid_id = 1;
  string tile_id = 2;
}

// EventPluginHealth reports a transition in a plugin's event-stream health,
// as seen by the router's fan-in (fanInEvents and watchPlugin in
// internal/server/router.go). Emitted on the down transition (healthy=false,
// detail carrying the dial, recv, or Info error that caused it) and again on
// recovery (healthy=true, detail=""). Only on a change of state, never per
// retry attempt, so a flapping plugin does not spam the client.
message EventPluginHealth {
  string plugin_uuid = 1;
  bool healthy       = 2;
  string detail       = 3;
}

// Event carries one of the change kinds. The variant tag is the
// discriminator; there is no separate kind string.
message Event {
  oneof payload {
    GridChanged grid_changed = 1;
    TileChanged tile_changed = 2;
    TileRemoved tile_removed = 3;
    EventPluginHealth plugin_health = 4;
  }
}

// Gridwell is the unified RPC surface, implemented by every node and by
// every plugin.
service Gridwell {
  // ── Lifecycle ───────────────────────────────────────────────────────────
  // Info is the whole handshake: identity plus the default root. Handshake
  // enumerates a node's plugins; the transport calls it on a remote to learn
  // that node's namespaces.
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // ── Shell (live PTY, both ways) ───────────────────────────────────────────
  rpc OpenShell(stream OpenShellRequest) returns (stream OpenShellResponse);

  // ── Reads ─────────────────────────────────────────────────────────────────
  rpc GetGrid(GetGridRequest)               returns (GetGridResponse);
  rpc GetTile(GetTileRequest)               returns (TileResponse);
  rpc GetTilePreview(GetTilePreviewRequest) returns (GetTilePreviewResponse);
  rpc Search(SearchRequest)                 returns (SearchResponse);

  // ── Content streams (the one way content bytes move; see the messages) ────
  rpc ReadContent(ReadContentRequest)        returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (TileResponse);

  // ── Web content (the HTTP /content/ door's RPC carrier) ──────────────────
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);

  // PlaceTile is the single placement writeback.
  rpc PlaceTile(PlaceTileRequest) returns (TileResponse);

  // ── Mutations (one create, one writeback, plus placement) ─────────────────
  rpc CreateTile(CreateTileRequest) returns (TileResponse);
  rpc SetTile(SetTileRequest)       returns (TileResponse);
  rpc CloneTile(CloneTileRequest)   returns (TileResponse);
  rpc DeleteTile(DeleteTileRequest) returns (DeleteTileResponse);

  // SetFraming persists the framing of a grid: onto the doorway tile it was
  // entered through, or onto the grid row itself for a root that has no
  // doorway. One verb, one shape, both rows.
  rpc SetFraming(SetFramingRequest) returns (SetFramingResponse);

  // ShellSessionAlive gates the client's refresh button on shell descent.
  rpc ShellSessionAlive(ShellSessionAliveRequest) returns (ShellSessionAliveResponse);

  rpc Subscribe(SubscribeRequest) returns (stream Event);
}
