// plugin.proto is THE PLUGIN INTERFACE (docs/v2-design.md §2.2, where it
// was designed as the "content provider" surface). A provider is STATELESS: it answers from its
// source (a directory tree, the process table, a mail account) in its own
// stable string KEYS, and never sees ids, layout, or a database. The node
// owns all of those: it mints numeric ids against keys, stores placement
// and framing in the external's memory DB, and serves the full Gridwell
// surface to clients — a provider is invisible on the federation wire.
//
// Key stability is the provider's one hard contract: a key names the same
// logical thing forever (a path relative to the configured root, a
// message-id, "pid:1234"). Changing the key scheme orphans every stored
// reference, exactly as re-minting ids would.
//
// Unimplemented is always polite: Search = no results, ServeContent =
// 404, Watch = no events, WriteContent = read-only, GetPreview = no
// thumbnail, Delete = refused. A minimal provider is Info + List +
// ReadContent.
syntax = "proto3";

package plugin.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/plugin/v1;pluginv1";

// ─── Handshake ─────────────────────────────────────────────────────────────

message InfoRequest {}
message InfoResponse {
  string kind         = 1; // e.g. "fs", "proc", "mail"
  string display_name = 2;
  string glyph        = 3; // declared glyph vocabulary; "" = the generic globe
  // root_context is the key of the provider's landing context ("" = the
  // provider has no landing grid; its entries appear only through
  // declarations/search).
  string root_context = 4;
  // watch: the provider implements Watch (live change events).
  bool watch = 5;
  // writable: the provider accepts WriteContent on (some of) its
  // entries. Presentation writes never reach a provider, so this is
  // purely a content capability.
  bool writable = 6;
  // menu_entries: the provider's declared (+) menu additions, stamped by
  // the node onto every grid it serves for this provider (the #258
  // mechanism, keyed by context instead of grid id).
  repeated MenuEntry menu_entries = 7;
}

// MenuEntry mirrors the gridwell.v1 shape with contexts for targets.
message MenuEntry {
  string id           = 1;
  string label        = 2;
  string glyph        = 3;
  string color        = 4;
  string kind         = 5; // creation entries: the created entry's kind
  string param_schema = 6; // creation entries: the #198-subset form
  string context      = 7; // root entries: the target context key
}

// ─── Listing ───────────────────────────────────────────────────────────────

// List enumerates one context — what GetGrid used to ask a plugin, minus
// every presentation fact. A context ≈ a grid; the node maps context
// keys to grid ids in the external's memory DB.
message ListRequest {
  string context = 1;
}
message ListResponse {
  repeated Entry entries = 1;
  // authoritative: this listing definitively enumerates the context — a
  // key absent from it is GONE (a readable directory). false: absence
  // means "not seen this pass" (the process table); the node keeps
  // serving remembered entries until Probe answers GONE. The one sweep
  // fact only the provider knows.
  bool authoritative = 2;
  // source_label is the human name of the backing source (the directory
  // path, the pid) — becomes Grid.source_id on the node surface.
  string source_label = 3;
}

message Entry {
  string key   = 1; // stable, unique within the provider
  string kind  = 2; // "well" | "text" | "url"
  string label = 3;
  // child_context: wells only — the context this entry opens into.
  string child_context = 4;
  bool   serves_page       = 5;
  string text_presentation = 6;
  string status_detail     = 7;
  // url entries: the address itself.
  string url_string = 8;
  // placement_hint, when set, seeds the entry's FIRST placement (a
  // calendar putting an event at its date). The user's arrangement wins
  // from then on; a hint never moves a placed tile.
  PlacementHint placement_hint = 9;
  // preview_stamp is a cheap GENERATION for the entry's preview (fs: an
  // image file's mtime) — the client keys its thumbnail cache by it, so
  // an edited image invalidates naturally. 0 = no stamp. Becomes
  // Tile.preview_blob_id on the node surface.
  int64 preview_stamp = 10;
}

message PlacementHint {
  int64 x = 1;
  int64 y = 2;
  int64 w = 3;
  int64 h = 4;
}

// ─── Content ───────────────────────────────────────────────────────────────

// ReadContent streams an entry's content bytes. Chunk 1 carries
// media_type; provider content is not version-edited (versions are a
// node fact).
message ReadContentRequest {
  string key = 1;
}
message ContentChunk {
  bytes  data       = 1;
  string media_type = 2; // chunk 1 only
}

// WriteContent streams an entry's new content up (first message binds
// the key). COMMIT AT CLOSE, like every Gridwell write: a broken stream
// leaves the old value intact. Providers that are pure projections
// leave it unimplemented.
message WriteContentRequest {
  string key  = 1;
  bytes  data = 2;
}
message WriteContentResponse {}

// ServeContent is the web-content door's provider half: GET-only,
// subpath "" is the entry's root page. Sandboxing happens at the node.
message ServeContentRequest {
  string key     = 1;
  string subpath = 2;
}
message ServeContentChunk {
  int64  status     = 1; // chunk 1 only; HTTP status
  string media_type = 2; // chunk 1 only
  bytes  data       = 3;
}

message GetPreviewRequest {
  string key = 1;
}
message GetPreviewResponse {
  bytes jpeg = 1;
}

// ─── Existence ─────────────────────────────────────────────────────────────

// Probe reports one entry's definitive presence — the arbiter for
// non-authoritative listings. UNSPECIFIED means "cannot say right now";
// a failed read must never read as GONE.
message ProbeRequest {
  string key = 1;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// Delete asks the provider to delete the SOURCE thing behind an entry
// (trash the file, signal the process). The node handles the id/layout
// side; presence catches up through List/Probe as usual.
message DeleteRequest {
  string key = 1;
}
message DeleteResponse {}

// ─── Search ────────────────────────────────────────────────────────────────

message SearchRequest {
  string query = 1;
  int32  limit = 2; // 0 = provider default
}
message SearchResult {
  Entry entry = 1;
  // context_path: the containing-context chain from the root, outermost
  // first — the node resolves it to a navigable tile path.
  repeated string context_path = 2;
  string snippet = 3;
  double score   = 4;
}
message SearchResponse {
  repeated SearchResult results = 1;
}

// ─── Events ────────────────────────────────────────────────────────────────

message WatchRequest {}
message ContextChanged {
  string context = 1;
}
message EntryRemoved {
  string context = 1;
  string key     = 2;
}
message Change {
  oneof payload {
    ContextChanged context_changed = 1;
    EntryRemoved   entry_removed   = 2;
  }
}

// Plugin is the plugin interface. Only nodes call it.
service Plugin {
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc List(ListRequest)               returns (ListResponse);
  rpc ReadContent(ReadContentRequest) returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (WriteContentResponse);
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);
  rpc GetPreview(GetPreviewRequest)   returns (GetPreviewResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc Delete(DeleteRequest)           returns (DeleteResponse);
  rpc Search(SearchRequest)           returns (SearchResponse);
  rpc Watch(WatchRequest)             returns (stream Change);
}
