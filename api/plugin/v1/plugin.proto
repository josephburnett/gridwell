// plugin.proto is the plugin interface. A plugin holds no node fact. It answers
// from its source, such as a directory tree or the process table, in its own
// stable string keys, and never sees ids, layout or a database. The node owns
// all of those: it mints ids against keys, keeps the arrangement as a namespace
// of its own store, and serves the full Gridwell surface to clients, so a
// plugin is invisible to a connection.
//
// A plugin may keep its own memory of its source, in the private directory the
// node hands it at spawn (`state_dir`), under cache.db's contract: disposable,
// safe to delete, rewarmed by use.
//
// Key stability is the plugin's one hard contract. A key names the same logical
// thing forever, such as a path relative to the configured root, a message-id
// or "pid:1234". Changing the key scheme orphans every stored reference, as
// re-minting ids would.
//
// Unimplemented is always polite: Search means no results, ServeContent a 404,
// an undeclared Watch no events, WriteContent read-only, GetPreview no
// thumbnail, and Delete refused. A minimal plugin is Info, List and
// ReadContent.
//
// docs/plugin-authoring.md is this contract from the plugin's side.
syntax = "proto3";

package plugin.v1;

option go_package = "github.com/josephburnett/gridwell/api/gen/plugin/v1;pluginv1";

// ─── Handshake ─────────────────────────────────────────────────────────────

message InfoRequest {}
message InfoResponse {
  string kind         = 1; // e.g. "fs", "proc", "mail"
  string display_name = 2;
  string glyph        = 3; // declared glyph vocabulary; "" = the generic globe
  // root_context is retired and its field number is kept rather than reused.
  // A plugin contributes doorways, one menu_entries row per collection, and
  // the node has no landing to choose among them. Leave it empty and declare
  // your collections.
  //
  // The node reads it in one case, so a binary built against the older proto
  // keeps presenting without a rebuild: a plugin that answers a root_context
  // and no menu_entries gets one derived entry onto it, wearing the plugin's
  // own name and face. Declare both and the entries win; there is no
  // privileged collection.
  string root_context = 4;
  // watch: the plugin implements Watch (live change events). It is the one
  // owner: the node opens Watch only when this is set. A plugin that sets it
  // and answers Unimplemented has live updates off, said once on a healthy
  // event; its listings still answer, so it is never shown dark.
  bool watch = 5;
  // writable: the plugin accepts WriteContent on its text entries. It is the
  // one owner: the node stamps it as Grid.writable on every grid it serves
  // for the plugin, so the client lets the user type into those tiles, and
  // without it they are read-only. Presentation writes never reach a plugin,
  // so this is a content capability only.
  bool writable = 6;
  // menu_entries: the plugin's collections, one row each, and the way a plugin
  // is reached. Each becomes a (+) menu swatch, and the node stamps them onto
  // every grid it serves for this plugin. Keyed by context instead of grid id.
  // Declaring none is legal and means the plugin contributes nothing to the
  // menu.
  repeated MenuEntry menu_entries = 7;
  // host_content: this plugin's contexts project host state, such as a
  // directory tree or the process table, rather than holding content of their
  // own. Their rows are summaries the node cannot re-arrange across contexts,
  // and the client renders them with the host treatment: the outside tint on
  // every tile and the exit border family on a descent. The node has no list of
  // which kinds are host-backed, so a third-party plugin gets the same
  // treatment by declaring it here. It becomes Grid.host_content on every grid
  // the node serves for this plugin.
  bool host_content = 8;
}

// MenuEntry mirrors the gridwell.v1 shape with contexts for targets: one of the
// plugin's collections, which the node stamps onto every grid it serves for
// this plugin.
message MenuEntry {
  string id           = 1;
  string label        = 2;
  string glyph        = 3;
  reserved 4, 5, 6; // color, kind, param_schema
  string context      = 7; // the target context key
}

// ─── Listing ───────────────────────────────────────────────────────────────

// List enumerates one context, carrying no presentation facts. A context is the
// plugin's word for a grid, and the node maps context keys to grid ids in the
// plugin's namespace of its store.
message ListRequest {
  string context = 1;
}
message ListResponse {
  repeated Entry entries = 1;
  // authoritative: this listing enumerates the context definitively, so a key
  // absent from it is gone, as for a readable directory. When false, absence
  // only means not seen this pass, as with the process table, and the node
  // keeps serving remembered entries until Probe answers GONE. It is the one
  // sweep fact only the plugin knows.
  bool authoritative = 2;
  // source_label is the name of the backing source, such as the directory path
  // or the pid. The node carries it onto the grid it serves (Grid.source_label)
  // and the client's bar shows it.
  string source_label = 3;
  // unreachable is empty when the listing is live. Otherwise the plugin
  // answered from memory and this is why, in a plain sentence; the node shows
  // it as the source's health and keeps serving the entries.
  string unreachable = 4;
}

message Entry {
  string key   = 1; // stable, unique within the plugin
  // kind: "well" | "text" | "url". A text entry is a document body the plugin
  // answers from ReadContent; a url entry is an address. Only a url entry may
  // serve a page.
  string kind  = 2;
  string label = 3;
  // child_context: wells only — the context this entry opens into.
  string child_context = 4;
  // serves_page: this entry's web content is the plugin's, served through
  // ServeContent. It is a url entry's address in place of url_string — the
  // node derives one at its /content/ door — so it rides kind "url" alone and
  // the door refuses it on any other kind.
  bool   serves_page       = 5;
  // text_presentation says how a text entry's body presents: "plain" for
  // verbatim monospace, "both" for the document renderer with a toggle to the
  // raw source, "" for no declaration. "rendered" is RETIRED — it hid the
  // source bytes, which the app never allows, and the node reads it as "both".
  // Any other value is refused at the door.
  string text_presentation = 6;
  string status_detail     = 7;
  // url entries: the address itself.
  string url_string = 8;
  // placement_hint, when set, is where the entry prefers to land first, such
  // as a calendar putting an event at its date. A hint that meets an occupied
  // cell takes the first free rect of its size below it in the same column,
  // so it never lands on another tile. The user's arrangement wins from then on, and a hint never moves a
  // placed tile.
  PlacementHint placement_hint = 9;
  // preview_stamp is a positive generation number for the entry's GetPreview
  // picture, such as an image file's mtime in fs, so an edited image
  // invalidates. 0 or less means no picture. The picture is the tile's face
  // until the node holds a screenshot of the tile, which wins from then on.
  int64 preview_stamp = 10;
  // link_target makes this entry a LINK to another of your entries, the one
  // that owns the content: the node draws it dashed, reads its content, face
  // and page through the target, and a copy of it is another link to the same
  // target. The entry keeps its own key, label, status_detail and placement;
  // its content facts (url_string, serves_page, text_presentation,
  // preview_stamp) are the target's and the node does not read them here.
  // Keep kind as the target's kind, and the content facts too if an older
  // node must still present it, since a node that predates this field shows
  // the entry as content of its own. The node mints nothing for the target
  // until the user touches it, and a target its context no longer holds
  // reads as a dead link. A well has no link variant here: its child_context
  // already names where it opens.
  EntryRef link_target = 11;
  // content_stamp names the bytes a text entry's ReadContent answers right
  // now, such as fs's file mtime and size: it changes whenever they do, and
  // "" means you name none. It is the version a plugin row lacks. The node
  // carries it on the tile (Tile.content_stamp), so a client holding the
  // body under another stamp knows its bytes moved and one holding it under
  // this stamp knows they did not. ReadContent answers the same stamp with
  // the bytes.
  string content_stamp = 12;
  // read_only says this text entry's body takes no edits, and why, in a
  // plain sentence the client shows; "" means it takes them when the plugin
  // is writable. Declare it for a body you know you would refuse, such as a
  // summary standing in for the bytes or a file the process may not write,
  // so the client never offers an edit that cannot land. It is the entry's
  // fact, as text_presentation is: writable says the plugin takes edits at
  // all. The node carries it on the tile (Tile.read_only).
  string read_only = 13;
}

// EntryRef names one entry by the plugin's own words: the context that lists
// it and its key there.
message EntryRef {
  string context = 1;
  string key     = 2;
}

message PlacementHint {
  int64 x = 1;
  int64 y = 2;
  int64 w = 3;
  int64 h = 4;
}

// ─── Content ───────────────────────────────────────────────────────────────

// ReadContent streams an entry's content bytes. Chunk 1 carries media_type
// and the bytes' content_stamp, taken before they are read so a change during
// the read cannot pass for these bytes. Plugin content is not version-edited;
// a version is a node fact.
message ReadContentRequest {
  string key = 1;
}
message ContentChunk {
  bytes  data          = 1;
  string media_type    = 2; // chunk 1 only
  string content_stamp = 3; // chunk 1 only; see Entry.content_stamp
}

// WriteContent streams an entry's whole new content up, and the first message
// binds the key and claims the stamp. It commits at close, like every
// Gridwell write, so a broken stream leaves the old value intact. A plugin
// that only projects a source leaves it unimplemented and does not declare
// writable.
//
// content_stamp is the stamp the writer read the bytes under
// (ContentChunk.content_stamp). Refuse a write whose stamp is not the entry's
// stamp now with FailedPrecondition, the conflict a stale version gets, so
// bytes the writer has not seen are never overwritten. Answer the stamp of
// the bytes written, which the writer's next write claims. The write is a
// change in place like any other, so your Watch tells it as the entry's
// EntryChanged; the node knows its own echo by the stamp.
message WriteContentRequest {
  string key           = 1;
  bytes  data          = 2;
  string content_stamp = 3; // first message only
}
message WriteContentResponse {
  string content_stamp = 1;
}

// ServeContent is the web-content door's plugin half. GET-only, and subpath ""
// is the entry's root page. Sandboxing happens at the node.
message ServeContentRequest {
  string key     = 1;
  string subpath = 2;
}
message ServeContentChunk {
  int64  status     = 1; // chunk 1 only; HTTP status
  string media_type = 2; // chunk 1 only
  bytes  data       = 3;
}

message GetPreviewRequest {
  string key = 1;
}
message GetPreviewResponse {
  bytes jpeg = 1;
}

// ─── Existence ─────────────────────────────────────────────────────────────

// Probe reports one entry's definitive presence, and arbitrates a
// non-authoritative listing. UNSPECIFIED means cannot say right now; a failed
// read must never read as GONE.
message ProbeRequest {
  string key = 1;
  // context is the context the node is asking about: GONE means the key has
  // left that context, which for a key listed in several contexts (a mail
  // thread in a box and in everything) is not the same as gone everywhere.
  // Empty means the node names none (a node from before contexts): answer
  // for the plugin as a whole.
  string context = 2;
}
message ProbeResponse {
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_PRESENT     = 1;
    PRESENCE_GONE        = 2;
  }
  Presence presence = 1;
}

// Delete asks the plugin to delete the source thing behind an entry: trash the
// file, signal the process. The node handles the id and layout side, and
// presence catches up through List and Probe.
message DeleteRequest {
  string key = 1;
}
message DeleteResponse {}

// ─── Search ────────────────────────────────────────────────────────────────

message SearchRequest {
  string query = 1;
  int32  limit = 2; // 0 = plugin default
}
message SearchResult {
  Entry entry = 1;
  // context_path is the containing-context chain from the root, outermost first.
  // The node resolves it to a navigable tile path.
  repeated string context_path = 2;
  string snippet = 3;
  double score   = 4;
}
message SearchResponse {
  repeated SearchResult results = 1;
}

// ─── Events ────────────────────────────────────────────────────────────────

// WatchRequest's contexts are your own context keys the node wants watched:
// the ones some client shows, on this node or any node that reaches it. A
// file shown in a pane counts through its context. When the set changes the
// node opens a stream with the new set and ends the old one only once the new
// one has sent its header, so a context in both is watched throughout; while
// nothing of yours is shown it holds none open. Empty means the node names no
// scope (a node from before scopes): watch what you judge cheap. A feed that
// is account-wide rather than per context may ignore the set.
message WatchRequest {
  repeated string contexts = 1;
}
// ContextChanged says context's listing may have moved: an entry added,
// removed, renamed or re-described. The node lists it and tells clients only
// if the answer moved, so a ContextChanged that moves nothing costs one List
// and no client anything.
message ContextChanged {
  string context = 1;
}
// EntryChanged says one entry changed in place, its bytes or its picture,
// with the listing otherwise as it was: a file written. entry is the entry
// re-read, exactly as List would answer it now, and the node needs nothing
// else to tell every client showing it. A plugin row carries no version, so
// this is the only way its bytes reach a body a client already holds.
message EntryChanged {
  string context = 1;
  Entry  entry   = 2;
}
// EntryRemoved is RETIRED and its arm number is kept rather than reused: a
// removal is a listing that moved, which ContextChanged says. The node reads
// it in one place, as a ContextChanged for its context, so an older binary
// keeps working. Do not send it.
message EntryRemoved {
  string context = 1;
  string key     = 2;
}
message Change {
  oneof payload {
    ContextChanged context_changed = 1;
    EntryRemoved   entry_removed   = 2;
    EntryChanged   entry_changed   = 3;
  }
}

// Plugin is the plugin interface. Only nodes call it.
service Plugin {
  rpc Info(InfoRequest)               returns (InfoResponse);
  rpc List(ListRequest)               returns (ListResponse);
  rpc ReadContent(ReadContentRequest) returns (stream ContentChunk);
  rpc WriteContent(stream WriteContentRequest) returns (WriteContentResponse);
  rpc ServeContent(ServeContentRequest) returns (stream ServeContentChunk);
  rpc GetPreview(GetPreviewRequest)   returns (GetPreviewResponse);
  rpc Probe(ProbeRequest)             returns (ProbeResponse);
  rpc Delete(DeleteRequest)           returns (DeleteResponse);
  rpc Search(SearchRequest)           returns (SearchResponse);
  rpc Watch(WatchRequest)             returns (stream Change);
}
