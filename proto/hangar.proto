// hangar.proto documents the Ascent RPC interface.
//
// The implementation uses HTTP+JSON in place of generated gRPC stubs. The wire
// format is the JSON encoding of the Go request/response structs declared in
// internal/rpc. This file is the source of truth for the RPC shape; see
// section 6 of the implementation spec.
syntax = "proto3";

package hangar;

service Hangar {
  // Auth.
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);

  // Read.
  rpc GetGrid(GetGridRequest) returns (GetGridResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc GetURLTitle(GetURLTitleRequest) returns (GetURLTitleResponse);

  // Mutations on grids.
  rpc CreateWell(CreateWellRequest) returns (NodeResponse);
  rpc CreateFile(CreateFileRequest) returns (NodeResponse);
  rpc MoveNode(MoveNodeRequest) returns (MoveNodeResponse);
  rpc CloneNode(CloneNodeRequest) returns (NodeResponse);
  rpc ResizeNode(ResizeNodeRequest) returns (NodeResponse);
  rpc SetNodeViewport(SetNodeViewportRequest) returns (NodeResponse);
  rpc CapWell(CapWellRequest) returns (NodeResponse);
  rpc RedigWell(RedigWellRequest) returns (NodeResponse);
  rpc FillWell(FillWellRequest) returns (FillWellResponse);
  rpc UpdateFileContent(UpdateFileContentRequest) returns (NodeResponse);

  // Tree-level.
  rpc AscendAtRoot(AscendAtRootRequest) returns (AscendAtRootResponse);

  // Real-time. Implemented as Server-Sent Events at /rpc/Subscribe.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message ViewRect {
  int64 x = 1;
  int64 y = 2;
  int64 w = 3;
  int64 h = 4;
}

message Path {
  repeated int64 well_ids = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}
message LoginResponse {
  int64 user_id = 1;
  string username = 2;
  int64 root_grid_id = 3;
}

message LogoutRequest {}
message LogoutResponse {}

message WhoamiRequest {}
message WhoamiResponse {
  int64 user_id = 1;
  string username = 2;
  int64 root_grid_id = 3;
}

message Grid {
  int64 id = 1;
  string object_id = 2;
  int64 owner_id = 3;
  int64 group_id = 4;
  int32 mode = 5;
  double default_view_cx = 6;
  double default_view_cy = 7;
  double default_zoom = 8;
}

message Node {
  int64 id = 1;
  string object_id = 2;
  int64 grid_id = 3;
  string type = 4;            // "well" | "file"
  int64 x = 5;
  int64 y = 6;
  int64 w = 7;
  int64 h = 8;
  int64 view_x = 9;
  int64 view_y = 10;
  int64 child_grid_id = 11;   // wells only
  bool capped = 12;
  string mime_type = 13;      // files only
  int64 blob_id = 14;
  int64 owner_id = 15;
  int64 group_id = 16;
  int32 mode = 17;
}

message GetGridRequest { int64 grid_id = 1; }
message GetGridResponse {
  Grid grid = 1;
  repeated Node nodes = 2;
  bool readable = 3;
  bool writable = 4;
}

message GetBlobRequest { int64 blob_id = 1; }
message GetBlobResponse {
  bytes data = 1;
  string mime_type = 2;
}

message GetURLTitleRequest { string url = 1; }
message GetURLTitleResponse { string title = 1; }

message CreateWellRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
}
message CreateFileRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 grid_id = 3;
  int64 x = 4;
  int64 y = 5;
  int64 w = 6;
  int64 h = 7;
  string mime_type = 8;
  bytes data = 9;
}
message NodeResponse { Node node = 1; }

message MoveNodeRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
  int64 dest_grid_id = 4;
  Path dest_path = 5;
  ViewRect dest_view_rect = 6;
  int64 x = 7;
  int64 y = 8;
}
message MoveNodeResponse { Node node = 1; }

message CloneNodeRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
  int64 dest_grid_id = 4;
  Path dest_path = 5;
  ViewRect dest_view_rect = 6;
  int64 x = 7;
  int64 y = 8;
}

message ResizeNodeRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
  int64 w = 4;
  int64 h = 5;
}

message SetNodeViewportRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
  int64 view_x = 4;
  int64 view_y = 5;
}

message CapWellRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
}
message RedigWellRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
}
message FillWellRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
}
message FillWellResponse {}

message UpdateFileContentRequest {
  Path path = 1;
  ViewRect view_rect = 2;
  int64 node_id = 3;
  bytes data = 4;
}

message AscendAtRootRequest {}
message AscendAtRootResponse {
  int64 new_root_grid_id = 1;
  int64 well_id = 2;
}

message SubscribeRequest {}

message Event {
  oneof kind {
    GridChanged grid_changed = 1;
    NodeChanged node_changed = 2;
    NodeRemoved node_removed = 3;
    GridForked grid_forked = 4;
  }
}
message GridChanged { int64 grid_id = 1; }
message NodeChanged { Node node = 1; }
message NodeRemoved { int64 grid_id = 1; int64 node_id = 2; }
message GridForked { int64 well_id = 1; int64 old_grid_id = 2; int64 new_grid_id = 3; }
